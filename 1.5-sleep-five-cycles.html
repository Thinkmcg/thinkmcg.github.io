<title>Five Cycles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one night-sky column: clock + cycle pips, a live hypnogram of the night, EEG readout, then the question card. */
:root {
  color-scheme: dark;
  --night: #0f1330;
  --panel: #171c40;
  --panel-2: #1f2552;
  --line: #313a70;
  --moon: #ece7d8;
  --dim: #a4a9cb;
  --lamp: #f3b562;
  --rem: #c9a0ea;
  --good: #8fdcb3;
  --bad: #f28b7c;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
}
html, body { background: var(--night); color: var(--moon); }
body {
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  background:
    radial-gradient(900px 500px at 88% -12%, rgba(236,231,216,.09), transparent 60%),
    var(--night);
  min-height: 100%;
}
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 16px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 6vw, 52px); line-height: .95; margin: 0; letter-spacing: -.02em; }
.brand h1 em { font-style: normal; color: var(--lamp); }
.brand p { margin: 6px 0 0; color: var(--dim); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.clock { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.clock .time { font-size: clamp(30px, 5vw, 42px); font-weight: 600; line-height: 1; }
.clock .ampm { font-size: 16px; color: var(--dim); margin-left: 4px; }
.clock small { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; letter-spacing: .04em; }
.clock.ring .time { color: var(--lamp); animation: ring .15s 6 alternate; }
@keyframes ring { to { transform: translateX(3px); } }

/* status */
.status { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.pips { display: flex; flex-wrap: wrap; gap: 10px; }
.cycle { display: flex; gap: 3px; align-items: center; }
.cycle .lbl { font-family: var(--f-mono); font-size: 11px; color: var(--dim); margin-right: 4px; }
.pip { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); background: transparent; transition: background .3s; }
.pip.on { background: var(--moon); border-color: var(--moon); }
.pip.on.rem { background: var(--rem); border-color: var(--rem); }
.wakes { font-size: 14px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
.wakes b { color: var(--moon); font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wakes .dots { display: flex; gap: 3px; }
.wakes .dots i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--line); }
.wakes .dots i.on { background: var(--lamp); border-color: var(--lamp); }

/* hypnogram */
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 6px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 0 4px 6px; }
.chart-head h2 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
#hypno { width: 100%; height: auto; display: block; }
#hypno text { font-family: var(--f-mono); font-size: 10px; fill: var(--dim); }

/* readout */
.readout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: center; }
.stage-now { min-width: 0; }
.stage-now .k { font-family: var(--f-mono); font-size: 11px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.stage-now .n { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.1; margin: 2px 0 4px; }
.stage-now .d { color: var(--dim); font-size: 14px; margin: 0; }
.eeg { min-width: 0; border-left: 1px solid var(--line); padding-left: 16px; }
.eeg canvas { width: 100%; height: 64px; display: block; }
.eeg .cap { font-family: var(--f-mono); font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; }

/* question card */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(18px, 3vw, 28px); }
.card h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.1; margin: 0 0 10px; text-wrap: balance; }
.card p { margin: 0 0 12px; max-width: 65ch; }
.card ul { margin: 0 0 18px; padding-left: 20px; display: grid; gap: 6px; max-width: 65ch; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; color: var(--lamp); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.eyebrow span:last-child { color: var(--dim); }
.prompt { font-size: clamp(18px, 2.4vw, 22px); line-height: 1.4; margin: 0 0 18px; max-width: 60ch; text-wrap: pretty; }
.prompt.term { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 4vw, 38px); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt {
  font: inherit; color: var(--moon); text-align: left; cursor: pointer;
  background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; min-width: 0;
  transition: border-color .15s, background .15s, transform .1s;
}
.opt span { min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--lamp); }
.opt:active:not(:disabled) { transform: translateY(1px); }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--panel-2)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--panel-2)); }
.opt.fade { opacity: .5; }
kbd { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--dim); flex: none; margin-top: 2px; }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--night); display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.fb p { margin: 0; flex: 1 1 320px; min-width: 0; }
.fb .tag { font-weight: 700; }
.fb.good .tag { color: var(--good); }
.fb.bad .tag { color: var(--bad); }
.btn {
  font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; padding: 11px 18px;
  background: var(--lamp); color: var(--night); border: 1.5px solid var(--lamp);
}
.btn.ghost { background: transparent; color: var(--moon); border-color: var(--line); }
.btn:hover { filter: brightness(1.06); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0 18px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--f-mono); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--dim); }
.missed { margin: 0 0 18px; display: grid; gap: 8px; }
.missed div { border-left: 3px solid var(--bad); padding: 2px 0 2px 12px; }
.missed b { display: block; }
.missed span { color: var(--dim); font-size: 14px; }

:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

/* glossary */
details.gloss { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 18px; }
details.gloss summary { cursor: pointer; padding: 12px 0; font-family: var(--f-display); font-weight: 500; font-size: 16px; }
.gloss-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 28px; padding-bottom: 16px; }
.gloss-grid h3 { grid-column: 1 / -1; margin: 12px 0 2px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--lamp); }
.gloss-grid p { margin: 0; font-size: 14px; color: var(--dim); min-width: 0; }
.gloss-grid p b { color: var(--moon); }

@media (max-width: 640px) {
  .readout { grid-template-columns: 1fr; }
  .eeg { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 10px; }
  .opts, .gloss-grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr 1fr; }
  .clock { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Five <em>Cycles</em></h1>
      <p>AP Psych 1.5 · Sleep vocabulary</p>
    </div>
    <div class="clock" id="clockBox" aria-live="polite">
      <span class="time" id="clock">10:00</span><span class="ampm" id="ampm">PM</span>
      <small>Alarm set for 7:00 AM</small>
    </div>
  </header>

  <div class="status">
    <div class="pips" id="pips" aria-label="Sleep cycle progress"></div>
    <div class="wakes" id="wakes"></div>
  </div>

  <section class="chart" aria-label="Hypnogram of your night">
    <div class="chart-head">
      <h2>Your night, as a hypnogram</h2>
      <div class="legend">
        <span style="--c: var(--moon)">Your sleep</span>
        <span style="--c: var(--rem)">REM</span>
        <span style="--c: var(--lamp)">Micro-wake-up</span>
        <span style="--c: var(--line)">Ideal night</span>
      </div>
    </div>
    <svg id="hypno" viewBox="0 0 560 200" role="img" aria-label="Sleep stages across the night"></svg>
    <div class="readout" style="padding: 8px 4px 8px;">
      <div class="stage-now">
        <div class="k">Right now</div>
        <div class="n" id="stageName">Awake</div>
        <p class="d" id="stageDesc">Relaxed in bed. Lights are about to go out.</p>
      </div>
      <div class="eeg">
        <canvas id="eeg" aria-hidden="true"></canvas>
        <div class="cap"><span>EEG</span><span id="waveName">alpha waves</span></div>
      </div>
    </div>
  </section>

  <section class="card" id="card" aria-live="polite"></section>

  <details class="gloss" id="gloss">
    <summary>Study all 24 terms</summary>
    <div class="gloss-grid" id="glossGrid"></div>
  </details>
</div>

<script>
const TERMS = [
  // Sleep and the body clock
  { t: "Sleep", g: "clock", d: "The periodic, natural loss of consciousness. It is different from a coma, anesthesia, or being awake." },
  { t: "Circadian rhythm", g: "clock", d: "The body's roughly 24-hour internal clock, generally set by sunlight, that controls sleeping and waking.",
    s: "You wake up at 7:00 a.m. every day, even on weekends without an alarm." },
  { t: "Melatonin", g: "clock", d: "The hormone that signals the body that it is time to sleep.",
    s: "As it gets dark outside, your body releases a hormone that makes you drowsy." },
  { t: "Cortisol", g: "clock", d: "A hormone the body uses as a waking signal.",
    s: "Morning light helps trigger a hormone that gets your body ready to wake up." },
  { t: "Jet lag", g: "clock", d: "Feeling out of sync after travel because your circadian rhythm no longer lines up with local day and night.",
    s: "Maya flies from Los Angeles to Tokyo and is wide awake at 3 a.m. local time." },
  { t: "Shift work", g: "clock", d: "Working at night or on rotating hours, which pulls the circadian rhythm out of line with day and night.",
    s: "A nurse rotates between day and night shifts and can't fall asleep during the day." },
  { t: "Growth hormone", g: "clock", d: "A hormone released mainly during sleep that helps the body grow and repair itself." },
  // Stages and brain waves
  { t: "EEG", g: "stages", d: "A tool that records the brain's electrical activity as brain waves. It is used to identify the stages of sleep.",
    s: "A sleep lab places electrodes on a volunteer's scalp to record brain waves all night." },
  { t: "Beta waves", g: "stages", d: "The fast brain waves of an alert, fully awake brain.",
    s: "You are focused on a test, fully alert, and your brain waves are fast and small." },
  { t: "Alpha waves", g: "stages", d: "The brain waves of a relaxed but still awake state.",
    s: "You're lying in bed with your eyes closed, calm, but not asleep yet." },
  { t: "NREM-1", g: "stages", d: "The short, hypnagogic 'falling asleep' stage. It is the lightest stage of sleep.",
    s: "As you drift off, you suddenly feel like you're falling and jerk awake." },
  { t: "NREM-2", g: "stages", d: "Light sleep that comes after the falling-asleep stage and before deep sleep." },
  { t: "NREM-3", g: "stages", d: "Deep sleep with delta waves. The brain drains chemical waste and the body repairs tissue.",
    s: "Early in the night, a sleeper is very hard to wake while their body repairs tissue." },
  { t: "Delta waves", g: "stages", d: "The large, slow brain waves of NREM-3 deep sleep.",
    s: "The EEG line turns into big, slow, rolling waves." },
  { t: "REM sleep", g: "stages", d: "The stage of rapid eye movement and vivid dreaming. The brain stem blocks the body's movement signals.",
    s: "The sleeper's eyes dart back and forth under their eyelids while they have a vivid dream." },
  { t: "Sleep cycle", g: "stages", d: "One pass through the stages of sleep, lasting roughly 90 minutes.",
    s: "About every 90 minutes, a sleeper works back around to another REM period." },
  // Dreams
  { t: "Dreams", g: "dreams", d: "Vivid hallucinations during sleep, often about familiar parts of our lives." },
  { t: "Activation-synthesis theory", g: "dreams", d: "Hobson and McCarley's idea that dreams are the brain's attempt to make sense of random neural activity during REM.",
    s: "A dream's strange, jumbled plot is explained as the brain stitching random REM firing into a story." },
  { t: "Consolidation theory", g: "dreams", d: "The idea that sleep, especially REM, stabilizes new memories and moves them into long-term storage.",
    s: "You sleep a full night after studying and remember much more the next day." },
  // Disorders
  { t: "Insomnia", g: "disorders", d: "A consistent lack of sleep or trouble staying asleep.",
    s: "Ava lies awake for hours almost every night, staring at the ceiling." },
  { t: "Narcolepsy", g: "disorders", d: "Uncontrolled bouts of falling asleep.",
    s: "Leo suddenly falls asleep in the middle of a conversation at lunch." },
  { t: "Sleep apnea", g: "disorders", d: "Breathing stops for moments during sleep, causing micro-wake-ups that rob a person of deep sleep.",
    s: "Dad snores, stops breathing for a few seconds at a time, and wakes up exhausted." },
  { t: "REM sleep behavior disorder", g: "disorders", d: "Acting out dreams during REM because the body's normal muscle paralysis is missing.",
    s: "Grandpa kicks and shouts in his sleep while acting out a dream about being chased." },
  { t: "Somnambulism", g: "disorders", d: "Sleepwalking: doing complex things like walking or talking during non-REM sleep.",
    s: "Early in the night, Sam walks to the kitchen and back to bed without waking up." },
];
const GROUPS = { clock: "Sleep and the body clock", stages: "Stages and brain waves", dreams: "Dreams", disorders: "Sleep disorders" };

// Night rules: every answer uses 18 minutes; 5 stages per 90-minute cycle.
const STEP = 18, SLOTS = 30, NEED = 25, START = 22 * 60;
const SEQ = ["N1", "N2", "N3", "N2", "R"];
const LVL = { W: 0, R: 1, N1: 2, N2: 3, N3: 4 };
const STAGE_INFO = {
  alpha: { n: "Awake", d: "Relaxed in bed. Lights are about to go out.", w: "alpha waves" },
  beta:  { n: "Micro-wake-up", d: "A wrong answer jolted you awake. You lost 18 minutes and stayed in the same stage.", w: "beta waves" },
  N1:    { n: "NREM-1", d: "The short, hypnagogic 'falling asleep' stage.", w: "light, uneven waves" },
  N2:    { n: "NREM-2", d: "Light sleep. You're heading toward deep sleep.", w: "slower waves" },
  N3:    { n: "NREM-3", d: "Deep sleep. The brain drains chemical waste and the body repairs tissue.", w: "delta waves" },
  R:     { n: "REM", d: "Rapid eye movement and vivid dreams. The brain stem blocks movement signals.", w: "fast, awake-like waves" },
  up:    { n: "Awake", d: "Morning. Time to see how you slept.", w: "beta waves" },
};

let state = fresh({});
function fresh(prevMissed) {
  return { phase: "intro", progress: 0, slot: 0, wakes: 0, correct: 0, hist: [], q: null, pick: null,
           missed: prevMissed || {}, roundMissed: {}, recent: [] };
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function clockText(slot) {
  const m = (START + slot * STEP) % 1440;
  let h = Math.floor(m / 60); const mm = String(m % 60).padStart(2, "0");
  const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return { t: `${h}:${mm}`, ap };
}

/* ---------- question generation ---------- */
function makeQuestion() {
  const pool = TERMS.filter((x) => !state.recent.includes(x.t));
  const weights = pool.map((x) => 1 + 3 * (state.missed[x.t] || 0));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0), term = pool[0];
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) { term = pool[i]; break; } }
  state.recent = [term.t, ...state.recent].slice(0, 8);

  const modes = [["def", 45], ["rev", 20]]; if (term.s) modes.push(["scn", 40]);
  let mr = Math.random() * modes.reduce((a, m) => a + m[1], 0), mode = "def";
  for (const [m, w] of modes) { mr -= w; if (mr <= 0) { mode = m; break; } }

  const same = shuffle(TERMS.filter((x) => x.g === term.g && x.t !== term.t));
  const other = shuffle(TERMS.filter((x) => x.g !== term.g));
  const distract = [...same, ...other].slice(0, 3);
  const choices = shuffle([term, ...distract]).map((x) => x.t);
  return { term: term.t, mode, choices, answer: choices.indexOf(term.t) };
}
const byName = (n) => TERMS.find((x) => x.t === n);

/* ---------- actions ---------- */
function begin() { state.phase = "play"; state.q = makeQuestion(); render(); focusFirst(); }
function choose(i) {
  if (state.phase !== "play") return;
  const q = state.q; state.pick = i;
  if (i === q.answer) {
    state.progress++; state.correct++;
    state.hist.push({ lvl: SEQ[(state.progress - 1) % 5] });
  } else {
    state.wakes++;
    state.missed[q.term] = (state.missed[q.term] || 0) + 1;
    state.roundMissed[q.term] = true;
    state.hist.push({ lvl: "W", wake: true });
  }
  state.slot++;
  state.phase = "feedback";
  render();
  const nb = $("nextBtn"); if (nb) nb.focus();
}
function next() {
  if (state.progress >= NEED || state.slot >= SLOTS) {
    state.phase = "end";
    if (state.progress < NEED) { const c = $("clockBox"); c.classList.remove("ring"); void c.offsetWidth; c.classList.add("ring"); }
  } else { state.phase = "play"; state.pick = null; state.q = makeQuestion(); }
  render(); focusFirst();
}
function again() {
  // Keep missed terms so they come up more often next round.
  const keep = {}; Object.keys(state.missed).forEach((k) => (keep[k] = Math.min(2, state.missed[k])));
  state = fresh(keep); $("clockBox").classList.remove("ring"); begin();
}
function focusFirst() { const b = document.querySelector("#card .opt, #card .btn"); if (b) b.focus({ preventScroll: true }); }

document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("summary")) return;
  if (state.phase === "play" && /^[1-4]$/.test(e.key)) { choose(+e.key - 1); e.preventDefault(); }
  else if (state.phase === "feedback" && e.key === "Enter" && document.activeElement?.id !== "nextBtn") { next(); e.preventDefault(); }
});

/* ---------- rendering ---------- */
function render() {
  const c = clockText(state.slot); $("clock").textContent = c.t; $("ampm").textContent = c.ap;
  renderPips(); renderWakes(); renderHypno(); renderStage(); renderCard();
}

function renderPips() {
  let h = "";
  for (let c = 0; c < 5; c++) {
    h += `<div class="cycle"><span class="lbl">C${c + 1}</span>`;
    for (let s = 0; s < 5; s++) {
      const i = c * 5 + s, on = i < state.progress;
      h += `<span class="pip${on ? " on" : ""}${on && s === 4 ? " rem" : ""}"></span>`;
    }
    h += `</div>`;
  }
  $("pips").innerHTML = h;
  $("pips").setAttribute("aria-label", `${Math.floor(state.progress / 5)} of 5 sleep cycles complete`);
}
function renderWakes() {
  const spare = SLOTS - NEED;
  let dots = ""; for (let i = 0; i < spare; i++) dots += `<i class="${i < state.wakes ? "on" : ""}"></i>`;
  $("wakes").innerHTML = `Wake-ups <b>${state.wakes}</b><span class="dots">${dots}</span><span>of ${spare} you can afford</span>`;
}

function renderHypno() {
  const W = 560, H = 200, L = 56, R = 30, T = 14, B = 30;
  const pw = W - L - R, ph = H - T - B;
  const x = (slot) => L + (slot / SLOTS) * pw;
  const y = (lv) => T + (lv / 4) * ph;
  let s = "";
  ["Awake", "REM", "NREM-1", "NREM-2", "NREM-3"].forEach((name, i) => {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(i)}" y2="${y(i)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="${i ? "2 4" : "0"}" opacity=".7"/>`;
    s += `<text x="${L - 8}" y="${y(i) + 3.5}" text-anchor="end">${name}</text>`;
  });
  const hrs = ["10p", "11p", "12a", "1a", "2a", "3a", "4a", "5a", "6a", "7a"];
  hrs.forEach((lab, h) => {
    const hx = L + ((h * 60) / (SLOTS * STEP)) * pw;
    s += `<line x1="${hx}" x2="${hx}" y1="${H - B}" y2="${H - B + 4}" stroke="var(--dim)"/>`;
    s += `<text x="${hx}" y="${H - B + 16}" text-anchor="middle">${lab}</text>`;
  });
  // alarm marker
  s += `<line x1="${x(SLOTS)}" x2="${x(SLOTS)}" y1="${T - 6}" y2="${H - B}" stroke="var(--lamp)" stroke-width="1" stroke-dasharray="3 3" opacity=".8"/>`;
  s += `<text x="${x(SLOTS)}" y="${T - 4}" text-anchor="middle" style="fill:var(--lamp)">alarm</text>`;
  // ideal night ghost
  let g = `M${x(0)},${y(0)}`;
  for (let i = 0; i < NEED; i++) g += ` V${y(LVL[SEQ[i % 5]])} H${x(i + 1)}`;
  g += ` V${y(0)}`;
  s += `<path d="${g}" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 4"/>`;
  // played path
  if (state.slot > 0 && state.slot < SLOTS) s += `<rect x="${x(state.slot)}" y="${T}" width="${x(SLOTS) - x(state.slot)}" height="${ph}" fill="var(--night)" opacity=".35"/>`;
  let p = `M${x(0)},${y(0)}`;
  state.hist.forEach((hst, i) => { p += ` V${y(LVL[hst.lvl])} H${x(i + 1)}`; });
  if (state.phase === "end") p += ` V${y(0)}`;
  s += `<path d="${p}" fill="none" stroke="var(--moon)" stroke-width="2" stroke-linejoin="round"/>`;
  state.hist.forEach((hst, i) => {
    if (hst.lvl === "R") s += `<line x1="${x(i)}" x2="${x(i + 1)}" y1="${y(1)}" y2="${y(1)}" stroke="var(--rem)" stroke-width="6" stroke-linecap="round"/>`;
    if (hst.wake) s += `<line x1="${x(i)}" x2="${x(i + 1)}" y1="${y(0)}" y2="${y(0)}" stroke="var(--lamp)" stroke-width="5" stroke-linecap="round"/>`;
  });
  const last = state.hist[state.hist.length - 1];
  const cy = state.phase === "end" || !last ? y(0) : y(LVL[last.lvl]);
  s += `<circle cx="${x(state.slot)}" cy="${cy}" r="5" fill="var(--lamp)" stroke="var(--night)" stroke-width="2"/>`;
  $("hypno").innerHTML = s;
}

function stageKey() {
  if (state.phase === "intro") return "alpha";
  if (state.phase === "end") return "up";
  const last = state.hist[state.hist.length - 1];
  if (!last) return "alpha";
  return last.wake ? "beta" : last.lvl;
}
function renderStage() {
  const k = stageKey(), info = STAGE_INFO[k];
  $("stageName").textContent = info.n; $("stageDesc").textContent = info.d; $("waveName").textContent = info.w;
  eeg.key = k === "up" ? "beta" : k; if (reduceMotion) drawEEG(0);
}

function renderCard() {
  const card = $("card");
  if (state.phase === "intro") {
    card.innerHTML = `
      <div class="eyebrow"><span>Lights out · 10:00 PM</span><span>24 terms from 1.5</span></div>
      <h2>Sleep through the whole night</h2>
      <p>Answer vocabulary questions to move through the stages of sleep. Every right answer is 18 minutes of real sleep and takes you one stage further in the cycle: NREM-1, NREM-2, NREM-3, back to NREM-2, then REM.</p>
      <ul>
        <li>Finish <b>five full cycles</b> (25 right answers) before the 7:00 AM alarm to wake up rested.</li>
        <li>A wrong answer is a <b>micro-wake-up</b>. You lose 18 minutes and stay in the same stage. You can afford 5.</li>
        <li>Press <kbd>1</kbd>–<kbd>4</kbd> to answer and <kbd>Enter</kbd> for the next question.</li>
      </ul>
      <div class="row"><button class="btn" id="startBtn">Turn off the lights</button>
      <button class="btn ghost" id="studyBtn">Study the terms first</button></div>`;
    $("startBtn").onclick = begin;
    $("studyBtn").onclick = () => { const g = $("gloss"); g.open = true; g.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }); };
    return;
  }
  if (state.phase === "end") return renderEnd(card);

  const q = state.q, term = byName(q.term), done = state.phase === "feedback";
  const cyc = Math.min(5, Math.floor((state.progress - (done && state.pick === q.answer ? 1 : 0)) / 5) + 1);
  const heads = { def: "Which term matches this definition?", scn: "Which term does this describe?", rev: "What does this term mean?" };
  const promptHtml = q.mode === "def" ? `<p class="prompt">${esc(term.d)}</p>`
    : q.mode === "scn" ? `<p class="prompt">${esc(term.s)}</p>`
    : `<p class="prompt term">${esc(term.t)}</p>`;
  const opts = q.choices.map((name, i) => {
    const label = q.mode === "rev" ? byName(name).d : name;
    let cls = "opt";
    if (done) cls += i === q.answer ? " correct" : i === state.pick ? " wrong" : " fade";
    return `<button class="${cls}" data-i="${i}" ${done ? "disabled" : ""}><kbd>${i + 1}</kbd><span>${esc(label)}</span></button>`;
  }).join("");
  let fb = "";
  if (done) {
    const right = state.pick === q.answer;
    const finished = state.progress >= NEED || state.slot >= SLOTS;
    const nextStage = right ? STAGE_INFO[SEQ[(state.progress - 1) % 5]].n : null;
    fb = `<div class="fb ${right ? "good" : "bad"}">
      <p><span class="tag">${right ? `Right. You drift into ${nextStage}.` : "Micro-wake-up."}</span>
      ${right ? "" : " The answer is"} <b>${esc(term.t)}</b>: ${esc(term.d)}</p>
      <button class="btn" id="nextBtn">${finished ? "See your morning" : "Next question"}</button></div>`;
  }
  card.innerHTML = `
    <div class="eyebrow"><span>Cycle ${cyc} of 5</span><span>Question ${state.slot + (done ? 0 : 1)} · ${SLOTS - state.slot} ${SLOTS - state.slot === 1 ? "slot" : "slots"} of night left</span></div>
    <h2>${heads[q.mode]}</h2>${promptHtml}
    <div class="opts">${opts}</div>${fb}`;
  card.querySelectorAll(".opt").forEach((b) => (b.onclick = () => choose(+b.dataset.i)));
  if (done) $("nextBtn").onclick = next;
}

function renderEnd(card) {
  const win = state.progress >= NEED;
  const cycles = Math.floor(state.progress / 5);
  const eff = state.slot ? Math.round((state.correct / state.slot) * 100) : 0;
  const woke = clockText(state.slot);
  const missed = Object.keys(state.roundMissed).map(byName);
  const head = win ? "Good morning. You woke up rested." : "Beep beep beep. The alarm went off.";
  const line = win
    ? `You finished five full cycles by ${woke.t} ${woke.ap} with ${state.wakes} micro-wake-up${state.wakes === 1 ? "" : "s"}. Five 90-minute cycles is about 7.5 hours of sleep.`
    : `You got through ${cycles} full cycle${cycles === 1 ? "" : "s"} before 7:00 AM. Most REM happens late in the night, so a cut-short night loses REM first.`;
  card.innerHTML = `
    <div class="eyebrow"><span>${win ? "Rested" : "Short night"}</span><span>${woke.t} ${woke.ap}</span></div>
    <h2>${head}</h2><p>${line}</p>
    <div class="stats">
      <div class="stat"><b>${cycles}/5</b><span>cycles completed</span></div>
      <div class="stat"><b>${state.correct}/${state.slot}</b><span>right answers</span></div>
      <div class="stat"><b>${eff}%</b><span>sleep efficiency</span></div>
    </div>
    ${missed.length ? `<p><b>Terms that woke you up</b>. These will come up more often next round.</p>
      <div class="missed">${missed.map((m) => `<div><b>${esc(m.t)}</b><span>${esc(m.d)}</span></div>`).join("")}</div>`
      : `<p>No wrong answers all night.</p>`}
    <div class="row"><button class="btn" id="againBtn">Sleep another night</button></div>`;
  $("againBtn").onclick = again;
}

function renderGlossary() {
  let h = "";
  for (const [g, name] of Object.entries(GROUPS)) {
    h += `<h3>${name}</h3>`;
    TERMS.filter((x) => x.g === g).forEach((x) => (h += `<p><b>${esc(x.t)}</b>: ${esc(x.d)}</p>`));
  }
  $("glossGrid").innerHTML = h;
}

/* ---------- EEG strip ---------- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const eeg = { key: "alpha", ctx: null, w: 0, h: 0, color: "#ece7d8" };
function sizeEEG() {
  const cv = $("eeg"), r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
  eeg.ctx = cv.getContext("2d"); eeg.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); eeg.w = r.width; eeg.h = r.height;
  eeg.color = getComputedStyle(document.documentElement).getPropertyValue("--moon").trim() || eeg.color;
}
function wave(k, x, t) {
  const S = Math.sin;
  switch (k) {
    case "beta": return .16 * S(x * .9 + t * 9) + .1 * S(x * 2.3 + t * 13) + .05 * S(x * 4.1 + t * 3);
    case "alpha": return .34 * S(x * .45 + t * 5) + .04 * S(x * 2 + t);
    case "N1": return .28 * S(x * .22 + t * 3) + .14 * S(x * .8 + t * 6) + .05 * S(x * 2.1);
    case "N2": { const e = Math.pow(Math.max(0, S((x + t * 40) * .025)), 10); return .24 * S(x * .2 + t * 3) + e * .4 * S(x * 1.5 + t * 20); }
    case "N3": return .82 * S(x * .06 + t * 1.2) + .1 * S(x * .45 + t * 4);
    case "R": { const saw = ((x * .12 + t * 4) % 1) * 2 - 1; return .2 * S(x * .6 + t * 7) + .12 * saw + .05 * S(x * 3); }
  }
  return 0;
}
function drawEEG(t) {
  const c = eeg.ctx; if (!c) return;
  c.clearRect(0, 0, eeg.w, eeg.h);
  c.strokeStyle = eeg.color; c.lineWidth = 1.5; c.beginPath();
  const mid = eeg.h / 2;
  for (let px = 0; px <= eeg.w; px += 1.5) {
    const v = wave(eeg.key, px, t);
    px === 0 ? c.moveTo(px, mid - v * mid * .9) : c.lineTo(px, mid - v * mid * .9);
  }
  c.stroke();
}
function loop(ms) { drawEEG(ms / 1000); requestAnimationFrame(loop); }

/* ---------- boot ---------- */
function start(data) {
  if (data && data.state) state = data.state;
  renderGlossary(); sizeEEG(); render();
  if (reduceMotion) drawEEG(0); else requestAnimationFrame(loop);
}
addEventListener("resize", () => { sizeEEG(); if (reduceMotion) drawEEG(0); });
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
