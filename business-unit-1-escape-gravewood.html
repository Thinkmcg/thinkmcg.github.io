<style>
/* Layout: a haunted candy factory. A top bar holds the exit-code slots and the clock to midnight;
   the hall shows five doors (four rooms + the exit); each room is one full-width puzzle card. Deliberately single dark theme. */
:root {
  color-scheme: dark;
  --night: #120e17;
  --panel: #1c1624;
  --panel-2: #251d30;
  --line: #3b2f47;
  --bone: #f0e7d4;
  --dim: #ab9fb8;
  --pumpkin: #f2892a;
  --candle: #ffd27a;
  --good: #8fd694;
  --bad: #ef6a5b;
  --paper: #e9dcc0;
  --ink: #2b2118;
  --f-title: "Creepster", "Impact", fantasy;
  --f-type: "Special Elite", "Courier New", monospace;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
}
html, body { background: var(--night); color: var(--bone); }
body {
  font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  background:
    radial-gradient(700px 380px at 85% -8%, rgba(255, 210, 122, .10), transparent 60%),
    radial-gradient(600px 400px at 5% 110%, rgba(242, 137, 42, .08), transparent 60%),
    var(--night);
  min-height: 100%;
}
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; display: grid; gap: 16px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 20px; }
.brand h1 { font-family: var(--f-title); font-weight: 400; font-size: clamp(34px, 6vw, 56px); line-height: .95; margin: 0; color: var(--pumpkin); letter-spacing: .02em; text-shadow: 0 0 18px rgba(242, 137, 42, .35); }
.brand p { margin: 4px 0 0; font-family: var(--f-mono); font-size: 12px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.status { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.code { display: flex; gap: 6px; }
.code span { width: 38px; height: 46px; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 8px; font-family: var(--f-mono); font-size: 24px; font-weight: 700; background: var(--panel); color: var(--dim); }
.code span.on { color: var(--candle); border-color: var(--candle); box-shadow: 0 0 12px rgba(255, 210, 122, .25); }
.clock { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.clock b { display: block; font-size: 26px; line-height: 1; }
.clock small { color: var(--dim); font-size: 12px; }
.clock.late b { color: var(--bad); }
.iconbtn { font: inherit; font-size: 14px; color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.iconbtn:hover { color: var(--bone); border-color: var(--dim); }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(18px, 3vw, 28px); }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--pumpkin); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.eyebrow span:last-child { color: var(--dim); }
h2.room { font-family: var(--f-title); font-weight: 400; font-size: clamp(30px, 4.5vw, 44px); line-height: 1; margin: 0 0 10px; color: var(--bone); letter-spacing: .02em; }
h3 { font-size: 18px; margin: 22px 0 8px; }
p { margin: 0 0 12px; max-width: 70ch; }
.muted { color: var(--dim); }
.step { display: flex; gap: 10px; align-items: baseline; margin: 22px 0 8px; }
.step b { font-family: var(--f-mono); font-size: 12px; color: var(--night); background: var(--pumpkin); border-radius: 5px; padding: 2px 7px; flex: none; }
.step span { font-weight: 700; }

/* hall */
.doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.door { font: inherit; color: var(--bone); text-align: left; cursor: pointer; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1.5px solid var(--line); border-radius: 60px 60px 10px 10px; padding: 26px 18px 18px; min-height: 190px; display: flex; flex-direction: column; gap: 6px; position: relative; transition: border-color .2s, transform .15s; }
.door:hover { border-color: var(--pumpkin); transform: translateY(-2px); }
.door .ico { font-size: 34px; line-height: 1; }
.door .nm { font-family: var(--f-title); font-size: 26px; line-height: 1.05; letter-spacing: .02em; }
.door .tp { font-family: var(--f-mono); font-size: 12px; color: var(--dim); }
.door .st { margin-top: auto; font-family: var(--f-mono); font-size: 13px; color: var(--dim); }
.door.done { border-color: var(--good); }
.door.done .st { color: var(--good); }
.door.exit { grid-column: 1 / -1; min-height: 0; border-radius: var(--r); flex-direction: row; align-items: center; gap: 16px; flex-wrap: wrap; }
.door.exit .nm { font-size: 30px; }

/* intro */
.story { font-family: var(--f-type); font-size: 18px; line-height: 1.6; }
.rules { display: grid; gap: 6px; padding-left: 20px; margin: 0 0 18px; max-width: 70ch; }
.who { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; margin: 0 0 16px; max-width: 560px; }
.who label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; min-width: 0; }
input[type=text], input[type=number] { font: inherit; color: var(--bone); background: var(--night); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
input:disabled { opacity: 1; }
.who input { font-size: 16px; text-transform: none; letter-spacing: 0; }
.who input.need { border-color: var(--bad); }

/* diary */
.diary { background: var(--paper); color: var(--ink); font-family: var(--f-type); font-size: 17px; line-height: 1.65; border-radius: 6px; padding: 22px 24px; max-width: 72ch; box-shadow: 0 6px 22px rgba(0,0,0,.4); transform: rotate(-.4deg); }
.diary .date { font-size: 14px; opacity: .75; margin-bottom: 6px; }
.diary q { font-style: italic; }

/* letter boxes */
.boxes { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.boxes input { width: 34px; height: 40px; padding: 0; text-align: center; font-family: var(--f-mono); font-size: 19px; font-weight: 700; text-transform: uppercase; border-radius: 6px; }
.boxes input.hl { border-color: var(--candle); box-shadow: inset 0 0 0 1px var(--candle), 0 0 10px rgba(255, 210, 122, .3); background: #2a2116; }
.boxes.ok input { border-color: var(--good); color: var(--good); }
.boxes.ok input.hl { color: var(--candle); }
.boxes.space { width: 12px; }

/* charts */
.chart { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 4px; max-width: 620px; margin: 8px 0; }
.chart div { border: 1px solid var(--line); border-radius: 6px; text-align: center; padding: 4px 0; background: var(--panel-2); font-family: var(--f-mono); }
.chart div b { display: block; font-size: 15px; color: var(--candle); }
.chart div span { font-size: 13px; color: var(--bone); }
.ouija { background: radial-gradient(ellipse at center, #3b2a1a, #24190f); border: 1px solid #5a4029; border-radius: 40px; padding: 18px; max-width: 660px; }
.ouija .chart div { background: transparent; border-color: #5a4029; }
.ouija .tag { font-family: var(--f-title); color: var(--candle); text-align: center; font-size: 22px; margin-bottom: 6px; letter-spacing: .08em; }

.lockrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 10px 0; }
.lockrow label { display: grid; gap: 4px; font-size: 14px; color: var(--dim); }
.lockrow input { width: 110px; font-family: var(--f-mono); font-size: 18px; }

/* graveyard */
.graves { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grave { background: linear-gradient(180deg, #4a4552, #34303b); border: 1px solid #5d5867; border-radius: 80px 80px 8px 8px; padding: 30px 14px 16px; text-align: center; color: #ece8f1; min-width: 0; }
.grave .rip { font-family: var(--f-title); font-size: 22px; letter-spacing: .1em; color: #cfc8da; }
.grave p { font-family: var(--f-type); font-size: 15px; line-height: 1.45; margin: 6px auto 10px; }
.grave .boxes { justify-content: center; }
.grave .boxes input { width: 26px; height: 32px; font-size: 15px; }
.grave.ok { border-color: var(--good); }

/* wheel */
.wheelwrap { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
#wheel { width: 260px; max-width: 100%; height: auto; }
#wheel text { font-family: var(--f-mono); }
.wheelctl { display: grid; gap: 8px; }
.msg { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.msg .pair { display: grid; gap: 4px; text-align: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.msg .pair .sym { font-size: 22px; letter-spacing: 2px; }
.msg .pair input { width: 48px; text-align: center; font-family: var(--f-mono); padding: 4px; }
.numchart { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; max-width: 520px; }
.numchart div { border: 1px solid var(--line); border-radius: 6px; text-align: center; padding: 4px 0; font-family: var(--f-mono); background: var(--panel-2); }
.numchart b { display: block; color: var(--candle); }

/* boardroom */
.bones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.bone { border: 1px solid var(--line); border-left: 4px solid var(--bone); border-radius: 8px; padding: 12px 14px; background: var(--panel-2); min-width: 0; }
.bone .who2 { font-family: var(--f-mono); font-size: 12px; color: var(--dim); }
.bone p { margin: 4px 0 6px; font-size: 16px; }
.bone.ok { border-left-color: var(--good); }

/* choices */
.opts { display: grid; gap: 8px; margin: 8px 0; }
.opt { font: inherit; color: var(--bone); text-align: left; cursor: pointer; background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 9px; padding: 10px 14px; }
.opt:hover:not(:disabled) { border-color: var(--pumpkin); }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel-2)); }
.opt.wrong { border-color: var(--bad); opacity: .7; }

/* exit */
.candles { display: flex; gap: 16px; margin: 6px 0 12px; font-size: 30px; }
.candles span { filter: grayscale(1) brightness(.5); transition: filter .4s; }
.candles span.lit { filter: none; animation: flick 1.6s infinite alternate; }
@keyframes flick { from { transform: scale(1); } to { transform: scale(1.06) rotate(-2deg); } }
.trial { border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 12px; }
.keypad { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.keypad input { width: 56px; height: 64px; font-size: 32px; text-align: center; font-family: var(--f-mono); }

/* buttons + feedback */
.btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 9px; padding: 10px 18px; background: var(--pumpkin); color: #1a0f05; border: 1.5px solid var(--pumpkin); }
.btn.ghost { background: transparent; color: var(--bone); border-color: var(--line); }
.btn:hover { filter: brightness(1.08); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toast { min-height: 24px; font-weight: 700; margin-top: 6px; }
.toast.good { color: var(--good); }
.toast.bad { color: var(--bad); }
.hint { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.hint p { color: var(--candle); font-family: var(--f-type); }
.solved { margin-top: 16px; padding: 12px 16px; border: 1.5px solid var(--good); border-radius: 10px; background: color-mix(in srgb, var(--good) 10%, var(--panel)); font-weight: 700; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }

/* results */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
.stat { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--dim); }
.sheet { width: 100%; border-collapse: collapse; font-size: 15px; margin: 8px 0 16px; }
.sheet td, .sheet th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.sheet th { font-family: var(--f-mono); font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.rank { font-family: var(--f-title); font-size: clamp(30px, 5vw, 46px); color: var(--candle); line-height: 1; margin: 4px 0 10px; }
.print-only { display: none; }
.confirm { border: 1px solid var(--bad); border-radius: 9px; padding: 10px 14px; margin-top: 10px; }

:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }

@media (max-width: 760px) {
  .doors, .graves { grid-template-columns: 1fr 1fr; }
  .bones { grid-template-columns: 1fr; }
  .chart { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .stats { grid-template-columns: 1fr 1fr; }
  .who { grid-template-columns: 1fr; }
}
@media (max-width: 480px) { .doors, .graves { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print {
  :root { --night: #fff; --panel: #fff; --panel-2: #fff; --line: #bbb; --bone: #111; --dim: #444; --candle: #8a5a00; --pumpkin: #b35a00; --good: #1d7a4a; color-scheme: light; }
  html, body { background: #fff !important; }
  .top .status .iconbtn, .row, .noprint { display: none !important; }
  .print-only { display: block; }
  .who input { border: 0; border-bottom: 1px solid #999; border-radius: 0; padding: 2px 0; }
  .brand h1 { text-shadow: none; }
}
</style>

         "Enter the four digits in the order of the slots at the top of the screen: Study, Graveyard, Market, Boardroom."],
};
const TAUNTS = ["Mortimer's ghost cackles. Not quite.", "A cold draft slips under the door. Try again.", "The candles gutter. That's not it.", "Somewhere a cauldron bubbles with laughter. Check your work.", "The floorboards creak 'no'."];

/* ===================== state ===================== */
const KEY = "gravewood-escape-v1";
function fresh() {
  return { phase: "intro", view: "hall", start: 0, end: 0, penalty: 0, wrong: 0, names: "", period: "",
    hints: { s1: 0, s2: 0, s3: 0, s4: 0, exit: 0 }, digits: [null, null, null, null],
    s1: { word: "", sum: "", digit: "", done: false },
    s2: { words: ["", "", "", "", "", ""], digit: "", done: false },
    s3: { rot: 0, word: "", strat: null, digit: "", done: false, scratch: [] },
    s4: { words: ["", "", "", "", "", ""], sum: "", digit: "", done: false },
    trials: [null, null, null, null], code: "" };
}
let state = load() || fresh();
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.s1 ? s : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ===================== sound ===================== */
let audio = null, soundOn = true;
function tone(freqs, dur = .18, type = "sine", gain = .07) {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    freqs.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      const st = t0 + i * dur * .8;
      g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(gain, st + .02); g.gain.exponentialRampToValueAtTime(.0001, st + dur);
      o.start(st); o.stop(st + dur + .02);
    });
  } catch (e) {}
}
const sfx = { good: () => tone([523, 659, 784], .16, "triangle"), bad: () => tone([196, 147], .22, "sawtooth", .04), unlock: () => tone([392, 523, 659, 1046], .2, "triangle"), creak: () => tone([110, 98, 82], .3, "square", .03) };

/* ===================== helpers ===================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function minutesElapsed() {
  if (!state.start) return 0;
  const end = state.end || Date.now();
  return (end - state.start) / 60000 + state.penalty;
}
function fmtClock(mins) {
  const total = 23 * 60 + 30 + Math.floor(mins);
  const h24 = Math.floor(total / 60) % 24, m = total % 60;
  const ap = h24 >= 12 ? "PM" : "AM", h = h24 % 12 || 12;
  return `${h}:${String(m).padStart(2, "0")} ${ap}`;
}
function fmtDur(mins) { const s = Math.round(mins * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function toast(el, msg, good) { el.className = "toast " + (good ? "good" : "bad"); el.textContent = msg; }
function miss(el, box) {
  state.wrong++; save(); sfx.bad();
  toast(el, TAUNTS[Math.floor(Math.random() * TAUNTS.length)], false);
  if (box) { box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); }
}

// A row of letter boxes; calls onChange(value) and marks itself ok when value matches the answer.
function letterBoxes(answer, hl, value, onChange, small) {
  const wrap = document.createElement("div");
  wrap.className = "boxes";
  const inputs = [];
  for (let i = 0; i < answer.length; i++) {
    const inp = document.createElement("input");
    inp.type = "text"; inp.maxLength = 1; inp.autocomplete = "off"; inp.spellcheck = false;
    inp.setAttribute("aria-label", `Letter ${i + 1} of ${answer.length}`);
    if (i === hl) inp.classList.add("hl");
    inp.value = value[i] || "";
    inp.addEventListener("input", () => {
      inp.value = norm(inp.value).slice(-1);
      if (inp.value && inputs[i + 1]) inputs[i + 1].focus();
      update();
    });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !inp.value && inputs[i - 1]) { inputs[i - 1].focus(); inputs[i - 1].value = ""; update(); e.preventDefault(); }
      if (e.key === "ArrowLeft" && inputs[i - 1]) inputs[i - 1].focus();
      if (e.key === "ArrowRight" && inputs[i + 1]) inputs[i + 1].focus();
    });
    inp.addEventListener("paste", (e) => {
      const t = norm(e.clipboardData.getData("text")); if (!t) return;
      e.preventDefault(); t.split("").forEach((ch, k) => { if (inputs[i + k]) inputs[i + k].value = ch; }); update();
    });
    inputs.push(inp); wrap.appendChild(inp);
  }
  function update() {
    const v = inputs.map((x) => x.value || " ").join("");
    const ok = v === answer;
    wrap.classList.toggle("ok", ok);
    if (ok) { inputs.forEach((x) => (x.disabled = true)); }
    onChange(v.replace(/ +$/, ""), ok);
  }
  if (norm(value) === answer) { wrap.classList.add("ok"); inputs.forEach((x) => (x.disabled = true)); }
  return wrap;
}

function hintBlock(room) {
  const used = state.hints[room], list = HINTS[room];
  let h = `<div class="hint noprint"><div class="row"><span class="muted">Stuck? Each hint adds 2 minutes to the clock.</span>`;
  if (used < list.length) h += `<button class="btn ghost" id="hintBtn">Light a hint candle (${used + 1} of ${list.length})</button>`;
  h += `</div>${list.slice(0, used).map((t) => `<p>🕯️ ${esc(t)}</p>`).join("")}</div>`;
  return h;
}
function wireHint(room) {
  const b = $("hintBtn");
  if (b) b.onclick = () => { state.hints[room]++; state.penalty += 2; save(); sfx.creak(); render(); };
}
function backBar(room) {
  const r = ROOMS[room];
  return `<div class="row noprint" style="margin-bottom:12px"><button class="btn ghost" id="backBtn">← Back to the hall</button></div>
    <div class="eyebrow"><span>${r ? r.topic + " · Exit code digit " + (r.slot + 1) : "The way out"}</span><span>${r && state.digits[r.slot] !== null ? "Unlocked" : "Locked"}</span></div>`;
}
function wireBack() { $("backBtn").onclick = () => go("hall"); }
function go(v) { state.view = v; save(); render(); window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" }); }
function unlock(room, digit) {
  state.digits[ROOMS[room].slot] = digit; state[room].done = true; save(); sfx.unlock();
}

/* ===================== views ===================== */
function render() {
  renderTop();
  const v = $("view");
  if (state.phase === "intro") return renderIntro(v);
  if (state.phase === "escaped") return renderEnd(v);
  ({ hall: renderHall, s1: renderS1, s2: renderS2, s3: renderS3, s4: renderS4, exit: renderExit })[state.view](v);
}

function renderTop() {
  $("codeSlots").innerHTML = state.digits.map((d) => `<span class="${d !== null ? "on" : ""}">${d !== null ? d : "?"}</span>`).join("");
  const mins = minutesElapsed();
  $("clockTime").textContent = state.start ? fmtClock(mins) : "11:30 PM";
  $("clock").classList.toggle("late", mins >= 30);
  $("clockSub").textContent = !state.start ? "Escape before midnight" : mins >= 30 ? "Past midnight. Keep going!" : `${Math.max(0, Math.ceil(30 - mins))} min until midnight`;
}
setInterval(() => { if (state.phase === "play") renderTop(); }, 1000);

function renderIntro(v) {
  v.innerHTML = `<section class="card">
    <div class="eyebrow"><span>Halloween night · Hollow Creek</span><span>4 rooms · 1 exit</span></div>
    <h2 class="room">Locked in at Gravewood Candy Co.</h2>

    <p class="story">If you are still inside at midnight, you work the night shift forever.</p>
    <h3>How to escape</h3>
    <ul class="rules">
      <li>Four rooms each hide <b>one digit</b> of the exit code. Solve them in <b>any order</b>.</li>
      <li>Every room needs Unit 1 knowledge <b>and</b> some puzzle solving. Every term must be correct to unlock it.</li>
      <li>At the Loading Dock, pass four trials to light the candles, then enter the code.</li>

    </ul>
    <div class="who">

function renderHall(v) {
  const doors = Object.entries(ROOMS).map(([k, r]) => {
    const d = state.digits[r.slot];
    return `<button class="door ${d !== null ? "done" : ""}" data-go="${k}"><span class="ico">${r.ico}</span><span class="nm">${r.name}</span><span class="tp">${r.topic}</span><span class="st">${d !== null ? "Unlocked · digit " + (r.slot + 1) + " = " + d : "Locked · digit " + (r.slot + 1)}</span></button>`;
  }).join("");

  </section>`;
  v.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => { sfx.creak(); go(b.dataset.go); }));
  $("resetBtn").onclick = () => {
    $("confirmBox").innerHTML = `<div class="confirm"><p>Erase all progress and restart the clock?</p><div class="row"><button class="btn" id="yesReset">Yes, start over</button><button class="btn ghost" id="noReset">Keep playing</button></div></div>`;
    $("yesReset").onclick = () => { const keep = { names: state.names, period: state.period }; state = Object.assign(fresh(), keep); save(); render(); };
    $("noReset").onclick = () => { $("confirmBox").innerHTML = ""; };

}

/* ---------- Station 1 ---------- */
function renderS1(v) {
  const ans = dec(S1.answer), st = state.s1;
  const chart = Object.entries(S1.values).map(([l, n]) => `<div><span>${l}</span><b>${n}</b></div>`).join("");
  v.innerHTML = `<section class="card">${backBar("s1")}
    <h2 class="room">The Founder's Study</h2>
    <p>Dust covers everything except one open diary on Mortimer Gravewood's desk.</p>
    <div class="diary"><div class="date">October 31, 1926</div>
      Tonight I hung two signs in my candy shop. The first, in the front hall, reads <q>A Hollow Creek where no child's Halloween is ever sweetless.</q> That one is my dream for the future, and it shows what I value.<br><br>
      The second I carved above the kitchen door, where my workers see it every morning: <q>We cook small batches of caramel by hand each dawn and deliver them warm to every shop in Hollow Creek.</q> It says nothing of dreams. It says what we do each day, and how we do it.<br><br>
      If you would leave my factory, name the kind of statement I carved above the kitchen door.
    </div>
    <div class="step"><b>1</b><span>Name the statement carved above the kitchen door (7 letters).</span></div>
    <div id="s1box"></div>

    <div class="step"><b>3</b><span>Subtract ${S1.minus} from the sum. That is the first digit of the exit code.</span></div>
    <div class="lockrow" id="s1lock">
      <label for="s1sum">Sum of the 7 values<input id="s1sum" type="number" inputmode="numeric" value="${esc(st.sum)}" ${st.done ? "disabled" : ""}></label>
      <label for="s1dig">Sum − ${S1.minus} = digit 1<input id="s1dig" type="number" inputmode="numeric" value="${esc(st.digit)}" ${st.done ? "disabled" : ""}></label>
      ${st.done ? "" : `<button class="btn" id="s1check">Try the lock</button>`}
    </div>
    <div class="toast" id="s1toast"></div>
    ${st.done ? `<div class="solved">🔓 The study door swings open. Digit 1 is ${S1.digit}. A mission says what a business does today and how; a vision describes the future it hopes to create.</div>` : ""}
    ${st.done ? "" : hintBlock("s1")}

  wireBack();

    unlock("s1", S1.digit); render();
  };
}

/* ---------- Station 2 ---------- */
function renderS2(v) {
  const st = state.s2;
  const answers = S2.map((g) => dec(g.a));
  const allOk = answers.every((a, i) => norm(st.words[i]) === a);
  const hlLetters = allOk ? answers.map((a, i) => a[S2[i].hl]) : [];
  v.innerHTML = `<section class="card">${backBar("s2")}
    <h2 class="room">The PESTEL Graveyard</h2>

    <p class="muted" id="s2letters">${allOk ? "Glowing letters: <b style='color:var(--candle);font-family:var(--f-mono);letter-spacing:.3em'>" + hlLetters.join(" ") + "</b>" : "The glowing letters appear once all six tombstones are named."}</p>
    <div class="lockrow" id="s2lock">
      <label for="s2dig">Vowels − consonants = digit 2<input id="s2dig" type="number" inputmode="numeric" value="${esc(st.digit)}" ${st.done ? "disabled" : ""}></label>

  </section>`;
  wireBack();

    el.appendChild(letterBoxes(answers[i], g.hl, st.words[i], (val, ok) => {
      st.words[i] = val; save(); el.classList.toggle("ok", ok);
      if (ok) { sfx.good(); const nowAll = answers.every((a, k) => norm(st.words[k]) === a); if (nowAll) render(); }

    const t = $("s2toast");
    if (!answers.every((a, k) => norm(st.words[k]) === a)) return toast(t, "Name all six tombstones first.", false);
    if (st.digit === "" || +st.digit !== S2_DIGIT) return miss(t, $("s2lock"));

  };
}

/* ---------- Station 3 ---------- */
function wheelSVG(rot) {
  const cx = 130, cy = 130;
  let s = `<circle cx="${cx}" cy="${cy}" r="124" fill="#2b1a0c" stroke="#f2892a" stroke-width="3"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="78" fill="#3a2410" stroke="#f2892a" stroke-width="2" stroke-dasharray="4 4"/>`;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
    s += `<text x="${cx + Math.cos(a) * 102}" y="${cy + Math.sin(a) * 102 + 9}" text-anchor="middle" font-size="26">${SYMS[i]}</text>`;
    const num = (i + rot) % 8;
    s += `<text x="${cx + Math.cos(a) * 56}" y="${cy + Math.sin(a) * 56 + 8}" text-anchor="middle" font-size="22" font-weight="700" fill="#ffd27a">${num}</text>`;
    const a2 = a + Math.PI / 8;
    s += `<line x1="${cx + Math.cos(a2) * 80}" y1="${cy + Math.sin(a2) * 80}" x2="${cx + Math.cos(a2) * 122}" y2="${cy + Math.sin(a2) * 122}" stroke="#5a3a1a" stroke-width="1.5"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="22" fill="#f2892a"/><text x="${cx}" y="${cy + 8}" text-anchor="middle" font-size="22">🍭</text>`;
  return `<svg id="wheel" viewBox="0 0 260 260" role="img" aria-label="Cipher wheel: outer ring of symbols, inner ring of numbers">${s}</svg>`;
}
function renderS3(v) {
  const st = state.s3, ans = dec(S3.answer);

  v.innerHTML = `<section class="card">${backBar("s3")}
    <h2 class="room">The Candy Market</h2>

    </div>
    <div class="step"><b>2</b><span>Read the message two symbols at a time. Each pair makes a two-digit number. (Use the small boxes for your work.)</span></div>
    <div class="msg">${msg}</div>
    <div class="step"><b>3</b><span>Turn each number into a letter with the market chart, and spell the word.</span></div>
    <div class="numchart">${chart}</div>
    <div id="s3box" style="margin-top:10px"></div>
    ${wordOk ? `<div class="step"><b>4</b><span>The spirit of the market asks a question.</span></div><p>${esc(S.q)}</p><div class="opts" id="s3opts"></div><div class="toast" id="s3qtoast"></div>` : ""}
    ${wordOk && st.strat === S.ok ? `<div class="step"><b>5</b><span>Count the vowels (A, E, I, O, U; not Y) in the decoded word. That is digit 3.</span></div>
      <div class="lockrow" id="s3lock"><label for="s3dig">Vowels = digit 3<input id="s3dig" type="number" inputmode="numeric" value="${esc(st.digit)}" ${st.done ? "disabled" : ""}></label>${st.done ? "" : `<button class="btn" id="s3check">Try the lock</button>`}</div>` : ""}
    <div class="toast" id="s3toast"></div>
    ${st.done ? `<div class="solved">🔓 The market vault unlocks. Digit 3 is ${S3.digit}. A commodity is so alike across sellers that buyers choose on price, so efficiency wins.</div>` : ""}
    ${st.done ? "" : hintBlock("s3")}
  </section>`;
  wireBack();
  const turn = (d) => { st.rot = (st.rot + d + 8) % 8; save(); $("wheelBox").innerHTML = wheelSVG(st.rot); tone([330 + st.rot * 20], .08, "square", .03); };
  $("rotL").onclick = () => turn(-1); $("rotR").onclick = () => turn(1);
  v.querySelectorAll("[data-sc]").forEach((inp) => (inp.oninput = () => { inp.value = inp.value.replace(/\D/g, ""); st.scratch[+inp.dataset.sc] = inp.value; save(); }));
  $("s3box").appendChild(letterBoxes(ans, -1, st.word, (val, ok) => { st.word = val; save(); if (ok && !wordOk) { sfx.good(); render(); } }));
  if (wordOk) {
    const box = $("s3opts");
    S.opts.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "opt" + (st.strat === i ? (i === S.ok ? " correct" : " wrong") : "");
      b.textContent = o; b.disabled = st.strat === S.ok;
      b.onclick = () => {
        st.strat = i; save();
        if (i === S.ok) { sfx.good(); render(); } else { miss($("s3qtoast"), b); b.classList.add("wrong"); }
      };
      box.appendChild(b);
    });
    if (st.strat === S.ok) toast($("s3qtoast"), S.why, true);
  }
  if (st.done) return;
  wireHint("s3");
  const dig = $("s3dig");
  if (dig) {
    dig.oninput = (e) => { st.digit = e.target.value; save(); };
    $("s3check").onclick = () => {
      if (+st.digit !== S3.digit || st.digit === "") return miss($("s3toast"), $("s3lock"));
      unlock("s3", S3.digit); render();
    };
  }
}

/* ---------- Station 4 ---------- */
function renderS4(v) {
  const st = state.s4, answers = S4.map((b) => dec(b.a));
  const allOk = answers.every((a, i) => norm(st.words[i]) === a);
  const chart = Object.entries(S4_VALUES).map(([l, n]) => `<div><span>${l}</span><b>${n}</b></div>`).join("");
  v.innerHTML = `<section class="card">${backBar("s4")}
    <h2 class="room">The Boardroom of Bones</h2>
    <p>Six skeletons sit around a long table, still holding their meeting notes from 1951. Each one clutches a definition card. Give each skeleton its term and it will drop its glowing letter.</p>
    <div class="bones" id="bones"></div>
    <div class="step"><b>2</b><span>Turn the six glowing letters into numbers with the board's chart, and add them up.</span></div>
    <p class="muted">${allOk ? "Glowing letters, in seat order: <b style='color:var(--candle);font-family:var(--f-mono);letter-spacing:.3em'>" + answers.map((a, i) => a[S4[i].hl]).join(" ") + "</b>" : "The glowing letters appear once all six skeletons have their terms."}</p>
    <div class="chart" style="grid-template-columns:repeat(7,minmax(0,1fr));max-width:420px">${chart}</div>
    <div class="step"><b>3</b><span>Subtract ${S4_MINUS} from the sum. That is digit 4.</span></div>
    <div class="lockrow" id="s4lock">
      <label for="s4sum">Sum of the 6 values<input id="s4sum" type="number" inputmode="numeric" value="${esc(st.sum)}" ${st.done ? "disabled" : ""}></label>
      <label for="s4dig">Sum − ${S4_MINUS} = digit 4<input id="s4dig" type="number" inputmode="numeric" value="${esc(st.digit)}" ${st.done ? "disabled" : ""}></label>
      ${st.done ? "" : `<button class="btn" id="s4check">Try the lock</button>`}
    </div>
    <div class="toast" id="s4toast"></div>
    ${st.done ? `<div class="solved">🔓 The skeletons applaud with a clatter. Digit 4 is ${S4_DIGIT}. Sole proprietors and partners are personally liable; LLC members and shareholders are not.</div>` : ""}
    ${st.done ? "" : hintBlock("s4")}
  </section>`;
  wireBack();
  const box = $("bones");
  S4.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = "bone" + (norm(st.words[i]) === answers[i] ? " ok" : "");
    el.innerHTML = `<div class="who2">Seat ${i + 1} · ${esc(b.seat)}</div><p>${esc(b.def)}</p>`;
    el.appendChild(letterBoxes(answers[i], b.hl, st.words[i], (val, ok) => {
      st.words[i] = val; save(); el.classList.toggle("ok", ok);
      if (ok) { sfx.good(); if (answers.every((a, k) => norm(st.words[k]) === a)) render(); }
    }));
    box.appendChild(el);
  });
  if (st.done) return;
  wireHint("s4");
  $("s4sum").oninput = (e) => { st.sum = e.target.value; save(); };
  $("s4dig").oninput = (e) => { st.digit = e.target.value; save(); };
  $("s4check").onclick = () => {
    const t = $("s4toast");
    if (!answers.every((a, k) => norm(st.words[k]) === a)) return toast(t, "Give all six skeletons their terms first.", false);
    if (+st.sum !== S4_SUM || +st.digit !== S4_DIGIT) return miss(t, $("s4lock"));
    unlock("s4", S4_DIGIT); render();
  };
}

/* ---------- Exit ---------- */
function renderExit(v) {
  const lit = state.trials.map((t, i) => t === TRIALS[i].ok);
  const allLit = lit.every(Boolean);
  v.innerHTML = `<section class="card">${backBar(null)}
    <h2 class="room">The Loading Dock</h2>
    <p>The great iron door is chained shut. Four candles stand before it, and a keypad glows beneath them. <q>Light my candles,</q> Mortimer whispers, <q>and speak the code.</q></p>
    <div class="candles">${lit.map((l) => `<span class="${l ? "lit" : ""}">🕯️</span>`).join("")}</div>
    <div id="trials"></div>
    ${allLit ? `<h3>The keypad</h3><p class="muted">Enter the four digits in slot order.</p>
      <div class="keypad" id="keypad">${[0, 1, 2, 3].map((i) => `<input type="text" inputmode="numeric" maxlength="1" data-k="${i}" aria-label="Code digit ${i + 1}" value="${esc(state.code[i] || "")}">`).join("")}
      <button class="btn" id="escapeBtn">Open the door</button></div>` : `<p class="muted">The keypad stays dark until all four candles are lit.</p>`}
    <div class="toast" id="exitToast"></div>
    ${hintBlock("exit")}
  </section>`;
  wireBack(); wireHint("exit");
  const box = $("trials");
  TRIALS.forEach((t, i) => {
    const el = document.createElement("div");
    el.className = "trial";
    el.innerHTML = `<div class="eyebrow"><span>Trial ${i + 1} · ${t.lesson}</span><span>${lit[i] ? "Candle lit" : ""}</span></div><p>${esc(t.q)}</p>`;
    const opts = document.createElement("div"); opts.className = "opts";
    const tt = document.createElement("div"); tt.className = "toast";
    t.opts.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "opt" + (lit[i] && k === t.ok ? " correct" : "");
      b.textContent = o; b.disabled = lit[i];
      b.onclick = () => {
        if (k === t.ok) { state.trials[i] = k; save(); sfx.good(); render(); }
        else { b.classList.add("wrong"); miss(tt, b); }
      };
      opts.appendChild(b);
    });
    el.appendChild(opts); el.appendChild(tt);
    if (lit[i]) toast(tt, t.why, true);
    box.appendChild(el);
  });
  if (!allLit) return;
  const ks = [...v.querySelectorAll("[data-k]")];
  ks.forEach((inp, i) => {
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, "").slice(-1); state.code = ks.map((x) => x.value || " ").join(""); save(); if (inp.value && ks[i + 1]) ks[i + 1].focus(); };
    inp.onkeydown = (e) => { if (e.key === "Backspace" && !inp.value && ks[i - 1]) ks[i - 1].focus(); if (e.key === "Enter") $("escapeBtn").click(); };
  });
  $("escapeBtn").onclick = () => {
    const code = ks.map((x) => x.value).join("");
    if (state.digits.some((d) => d === null)) return toast($("exitToast"), "Some rooms are still locked. You need all four digits.", false);
    if (code !== EXIT_CODE) return miss($("exitToast"), $("keypad"));
    state.phase = "escaped"; state.end = Date.now(); save();
    sfx.unlock(); setTimeout(() => sfx.creak(), 500);
    render(); window.scrollTo(0, 0);
  };
}

/* ---------- Results ---------- */
function rankFor(m) {
  if (m < 15) return ["Ghost Whisperer", "Under 15 minutes. Mortimer himself is impressed."];
  if (m < 20) return ["Night Watch", "Under 20 minutes. The factory barely slowed you down."];
  if (m < 30) return ["Escaped Before Midnight", "You beat the clock. No night shift for you."];
  return ["Escaped... Eventually", "Past midnight, but you got out. Mortimer lets it slide this once."];
}
function renderEnd(v) {
  const mins = minutesElapsed(), [rank, line] = rankFor(mins);
  const hintsUsed = Object.values(state.hints).reduce((a, b) => a + b, 0);
  const rows = [
    ["Founder's Study (1.5)", dec(S1.answer), S1.digit],
    ["PESTEL Graveyard (1.3)", S2.map((g) => dec(g.a)).join(", "), S2_DIGIT],
    ["Candy Market (1.2)", dec(S3.answer) + "; strategy: efficiency", S3.digit],
    ["Boardroom of Bones (1.7)", S4.map((b) => dec(b.a)).join(", "), S4_DIGIT],
    ["Loading Dock (1.1, 1.4, 1.6, 1.8)", "Value capture; MVP; recall the batch; cheap suppliers + mass production", EXIT_CODE],
  ];
  v.innerHTML = `<section class="card">
    <div class="eyebrow"><span>Escaped at ${fmtClock(mins)}</span><span>Gravewood Candy Co.</span></div>
    <h2 class="room">The door creaks open. You're free!</h2>
    <div class="rank">${rank}</div>
    <p>${line}</p>
    <div class="stats">
      <div class="stat"><b>${fmtDur(mins)}</b><span>total time (with hint penalties)</span></div>
      <div class="stat"><b>${fmtClock(mins)}</b><span>escape time</span></div>
      <div class="stat"><b>${hintsUsed}</b><span>hints used (+${state.penalty} min)</span></div>
      <div class="stat"><b>${state.wrong}</b><span>wrong guesses</span></div>
    </div>
    <h3>Decoding sheet</h3>
    <div style="overflow-x:auto"><table class="sheet"><thead><tr><th>Room</th><th>Terms solved</th><th>Digit</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td><b>${esc(r[2])}</b></td></tr>`).join("")}
    </tbody></table></div>
    <div class="who">
      <label for="teamNames">Team names<input id="teamNames" type="text" autocomplete="off" value="${esc(state.names)}"></label>
      <label for="teamPeriod">Period<input id="teamPeriod" type="text" autocomplete="off" value="${esc(state.period)}"></label>
    </div>
    <p class="print-only">Escape Gravewood · AP Business Unit 1 · completed ${esc(new Date(state.end).toLocaleString())}</p>
    <div class="row"><button class="btn" id="printBtn">Print / Save as PDF</button><button class="btn ghost" id="againBtn">Play again</button></div>
    <p class="toast bad" id="printNote" hidden>Type your team names before printing.</p>
    <div id="confirmBox"></div>
  </section>`;
  $("teamNames").oninput = (e) => { state.names = e.target.value; e.target.classList.remove("need"); $("printNote").hidden = true; save(); };
  $("teamPeriod").oninput = (e) => { state.period = e.target.value; save(); };
  $("printBtn").onclick = () => {
    if (!state.names.trim()) { $("teamNames").classList.add("need"); $("printNote").hidden = false; $("teamNames").focus(); return; }
    printWithFileName(state.names, state.period, "Escape Gravewood");
  };
  $("againBtn").onclick = () => {
    $("confirmBox").innerHTML = `<div class="confirm"><p>Start a new escape? This clears your results.</p><div class="row"><button class="btn" id="yesReset">Yes, play again</button><button class="btn ghost" id="noReset">Keep my results</button></div></div>`;
    $("yesReset").onclick = () => { const keep = { names: state.names, period: state.period }; state = Object.assign(fresh(), keep); save(); render(); };
    $("noReset").onclick = () => { $("confirmBox").innerHTML = ""; };
  };
}

// Chrome uses the page title as the default PDF file name, so set it just for the print.
function printWithFileName(name, period, game) {
  const clean = (s) => String(s || "").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
  const d = new Date(), date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const p = clean(period);
  const parts = [clean(name), p && (/^\d+$/.test(p) ? "Period " + p : p), game, date].filter(Boolean);
  const old = document.title;
  document.title = parts.join(" - ");
  addEventListener("afterprint", () => { document.title = old; }, { once: true });
  window.print();
}

$("soundBtn").onclick = () => { soundOn = !soundOn; $("soundBtn").textContent = soundOn ? "Sound on" : "Sound off"; $("soundBtn").setAttribute("aria-pressed", soundOn); };
render();
</script>
