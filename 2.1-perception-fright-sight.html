<meta charset="utf-8">
<title>Fright Sight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Lexend:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: a single haunted-night look by design. House with ten windows on top, the current room's scene and choices below. */
:root {
  color-scheme: dark;
  --sky: #140f24;
  --panel: #1f1834;
  --panel-2: #2a2145;
  --line: #3f3463;
  --bone: #efe7d6;
  --dim: #b3a9cc;
  --pumpkin: #ff8a1f;
  --slime: #9be564;
  --blood: #ff6b6b;
  --window-off: #2b2440;
  --f-display: "Creepster", "Impact", fantasy;
  --f-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Space Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
}
html, body { background: var(--sky); color: var(--bone); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  background: radial-gradient(700px 360px at 85% -5%, rgba(255,138,31,.16), transparent 60%), radial-gradient(900px 500px at 10% 110%, rgba(155,229,100,.07), transparent 60%), var(--sky); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 44px; display: grid; gap: 16px; }

.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(44px, 8vw, 74px); line-height: .9; margin: 0; color: var(--pumpkin); letter-spacing: .02em; text-shadow: 0 0 18px rgba(255,138,31,.35); }
.brand p { margin: 6px 0 0; font-family: var(--f-mono); font-size: 13px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.score { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.score .big { font-size: clamp(28px, 5vw, 38px); font-weight: 700; color: var(--pumpkin); line-height: 1; }
.score small { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; }

.house-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
#house { width: 100%; height: auto; display: block; max-height: 260px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--dim); padding: 6px 4px 0; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(18px, 3vw, 28px); }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--slime); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.eyebrow span:last-child { color: var(--dim); }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 4.6vw, 42px); line-height: 1; margin: 0 0 10px; color: var(--bone); letter-spacing: .02em; }
.card p { margin: 0 0 12px; max-width: 66ch; }
.card ul { margin: 0 0 18px; padding-left: 20px; display: grid; gap: 6px; max-width: 66ch; }
.scene { font-size: clamp(19px, 2.5vw, 23px); line-height: 1.45; margin: 0 0 18px; max-width: 60ch; }
.step-q { font-weight: 700; margin: 0 0 12px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opts.five { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { font: inherit; color: var(--bone); text-align: left; cursor: pointer; background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 14px; display: flex; gap: 12px; align-items: flex-start; min-width: 0; transition: border-color .15s, background .15s; }
.opt span { min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--pumpkin); }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--slime); background: color-mix(in srgb, var(--slime) 15%, var(--panel-2)); }
.opt.wrong { border-color: var(--blood); background: color-mix(in srgb, var(--blood) 15%, var(--panel-2)); }
.opt.fade { opacity: .5; }
kbd { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--dim); flex: none; margin-top: 2px; }
.fb { margin-top: 14px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--sky); display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.fb p { margin: 0; flex: 1 1 320px; min-width: 0; }
.fb .tag { font-weight: 700; }
.fb.good .tag { color: var(--slime); }
.fb.bad .tag { color: var(--blood); }
.btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; padding: 11px 18px; background: var(--pumpkin); color: #1a1022; border: 1.5px solid var(--pumpkin); }
.btn.ghost { background: transparent; color: var(--bone); border-color: var(--line); }
.btn:hover { filter: brightness(1.08); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.boo { animation: boo .5s ease-out; }
@keyframes boo { 0% { box-shadow: inset 0 0 0 999px rgba(255,107,107,.25); } 100% { box-shadow: inset 0 0 0 999px rgba(255,107,107,0); } }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0 18px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--f-mono); font-size: 24px; font-variant-numeric: tabular-nums; color: var(--pumpkin); }
.stat span { font-size: 14px; color: var(--dim); }
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.cat-chip { display: flex; justify-content: space-between; gap: 8px; border-left: 4px solid var(--pumpkin); padding: 6px 10px; background: var(--panel-2); font-size: 15px; }
.cat-chip b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.missed { margin: 0 0 18px; display: grid; gap: 8px; }
.missed div { border-left: 3px solid var(--blood); padding: 2px 0 2px 12px; }
.missed b { display: block; }
.missed span { color: var(--dim); font-size: 15px; }
.who { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; margin: 0 0 14px; max-width: 520px; }
.who label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; min-width: 0; }
.who input { font: inherit; font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--bone); background: var(--sky); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.who input.need { border-color: var(--blood); }
.print-note { font-size: 15px; color: var(--blood); margin: 8px 0 0; }
.print-only { display: none; }

details.ref { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 18px; }
details.ref summary { cursor: pointer; padding: 12px 0; font-weight: 700; }
.ref-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; padding-bottom: 16px; }
.ref-grid h3 { grid-column: 1 / -1; margin: 10px 0 0; font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--pumpkin); }
.ref-grid p { margin: 0; font-size: 14px; color: var(--dim); min-width: 0; }
.ref-grid p b { color: var(--bone); }

:focus-visible { outline: 2px solid var(--slime); outline-offset: 2px; }
@media (max-width: 680px) {
  .opts, .opts.five, .ref-grid { grid-template-columns: 1fr; }
  .cats { grid-template-columns: 1fr 1fr; }
  .score { text-align: left; }
}
@media print {
  :root { --sky: #fff; --panel: #fff; --panel-2: #fff; --line: #bbb; --bone: #111; --dim: #444; --pumpkin: #b85a00; --slime: #2d7a2d; --blood: #b3392a; color-scheme: light; }
  html, body { background: #fff !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; text-shadow: none !important; }
  .ref, .row, .print-note, #playCard { display: none !important; }
  .print-only { display: block; }
  .who input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 2px 0; }
  .card, .house-card { break-inside: avoid; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Fright Sight</h1><p>2.1 Perception</p></div>
    <div class="score" aria-live="polite"><span class="big" id="candy">0</span><span class="big" style="color:var(--dim)">/20</span><small>pieces of candy · room <span id="roomNum">0</span> of 10</small></div>
  </header>

  <section class="house-card" aria-label="The haunted house">
    <svg id="house" viewBox="0 0 600 250" role="img" aria-label="Haunted house with ten windows"></svg>
    <div class="legend">
      <span style="--c: var(--pumpkin)">Room cleared</span>
      <span style="--c: var(--slime)">Cleared with one scare</span>
      <span style="--c: var(--blood)">Two scares</span>
      <span style="--c: var(--window-off)">Not explored yet</span>
    </div>
  </section>

  <section class="card" id="playCard" aria-live="polite"></section>
  <section class="card" id="endCard" hidden></section>

  <details class="ref">
    <summary>Spell book: every perception term</summary>
    <div class="ref-grid" id="refGrid"></div>
  </details>
</div>

<script>
const CATS = {
  process:   { name: "Processing and expectations", terms: { "Bottom-up processing": "Perception driven by incoming sensory information.", "Top-down processing": "Perception guided by prior expectations and knowledge.", "Schema": "A mental framework that organizes and interprets information.", "Perceptual set": "Expectations that shape what we perceive.", "Context": "The surrounding environment changes how we perceive.", "Culture": "Cultural experiences shape how we interpret things like gestures." } },
  gestalt:   { name: "Gestalt grouping", terms: { "Closure": "Seeing incomplete figures as complete.", "Figure and ground": "Separating an object from its background.", "Proximity": "Seeing objects that are close together as a group.", "Similarity": "Seeing similar objects as a group." } },
  attention: { name: "Attention", terms: { "Cocktail party effect": "Hearing your name in a noisy room; a form of selective attention.", "Change blindness": "Failing to notice a change because of inattention." } },
  depth:     { name: "Depth perception", terms: { "Retinal disparity": "Binocular: each eye's image is slightly different.", "Convergence": "Binocular: the eyes turn inward to focus on something close.", "Relative clarity": "Clearer objects seem closer.", "Relative size": "Larger objects seem closer.", "Texture gradient": "Detailed textures seem closer; smooth ones seem farther.", "Linear perspective": "Parallel lines seem to meet in the distance.", "Interposition": "An object that overlaps another seems closer." } },
  constancy: { name: "Constancy and motion", terms: { "Size constancy": "An object seems the same size as its distance changes.", "Shape constancy": "An object seems the same shape from different angles.", "Color constancy": "Familiar objects keep their color under different lighting.", "Apparent movement": "Seeing motion in a quick series of still images." } },
};
const ROOMS = ["Foyer", "Library", "Ballroom", "Attic", "Cellar", "Parlor", "Crypt", "Conservatory", "Tower", "Kitchen"];
const SCEN = [
  { c: "process", a: "Perceptual set", o: ["Bottom-up processing", "Context", "Culture"], t: "A friend whispers that the attic is haunted. Moments later, you see a face in the shadowy curtains." },
  { c: "process", a: "Bottom-up processing", o: ["Top-down processing", "Schema", "Culture"], t: "You hear an eerie organ tune you've never heard before and pick out its melody, note by note." },
  { c: "process", a: "Schema", o: ["Culture", "Context", "Bottom-up processing"], t: "A little trick-or-treater calls a black cat costume a \"spooky doggy\" because it has four legs and a tail." },
  { c: "process", a: "Context", o: ["Culture", "Schema", "Perceptual set"], t: "At a pounding Halloween party you can barely follow your friend's ghost story, but in the quiet library you hear every word." },
  { c: "process", a: "Culture", o: ["Context", "Bottom-up processing", "Schema"], t: "A visitor from another country reads the hand gesture on your jack-o'-lantern as rude, though you meant it as friendly." },
  { c: "gestalt", a: "Closure", o: ["Figure and ground", "Proximity", "Similarity"], t: "A skeleton made of separate bone cutouts, with gaps between them, still looks like one whole skeleton." },
  { c: "gestalt", a: "Figure and ground", o: ["Closure", "Proximity", "Similarity"], t: "A spooky poster shows either a white vase or two black ghost faces, depending on what you treat as the background." },
  { c: "gestalt", a: "Proximity", o: ["Closure", "Figure and ground", "Similarity"], t: "Bats flying close together look like one dark cloud against the moon." },
  { c: "gestalt", a: "Similarity", o: ["Closure", "Figure and ground", "Proximity"], t: "In a mixed pile of candy, you instantly see the orange pieces as one group and the purple pieces as another." },
  { c: "attention", a: "Cocktail party effect", o: ["Change blindness", "Closure", "Convergence"], t: "Through the screams and chainsaws of a haunted hayride, you still hear someone call your name." },
  { c: "attention", a: "Change blindness", o: ["Cocktail party effect", "Shape constancy", "Proximity"], t: "Glued to a scary movie, you never notice that the actor's cape changed from red to black between shots." },
  { c: "depth", a: "Retinal disparity", o: ["Convergence", "Interposition", "Linear perspective"], t: "Close one eye, then the other: the candle flickering in front of you seems to jump from side to side." },
  { c: "depth", a: "Convergence", o: ["Retinal disparity", "Relative size", "Texture gradient"], t: "As a rubber spider dangles closer to your nose, your eyes turn inward to keep it in focus." },
  { c: "depth", a: "Relative clarity", o: ["Texture gradient", "Interposition", "Linear perspective"], t: "In the foggy graveyard, the far tombstones look hazy and blurry, so they seem farther away." },
  { c: "depth", a: "Interposition", o: ["Relative size", "Convergence", "Relative clarity"], t: "One crooked gravestone partly blocks the one behind it, so it looks closer." },
  { c: "depth", a: "Linear perspective", o: ["Texture gradient", "Retinal disparity", "Relative size"], t: "The walls of the haunted hallway seem to squeeze together into a single point in the darkness." },
  { c: "depth", a: "Texture gradient", o: ["Relative clarity", "Linear perspective", "Convergence"], t: "The gravel on the cemetery path looks rough and detailed at your feet but smooth far away." },
  { c: "depth", a: "Relative size", o: ["Interposition", "Retinal disparity", "Linear perspective"], t: "Two identical pumpkins sit in a field. The one that looks smaller seems farther away." },
  { c: "constancy", a: "Size constancy", o: ["Shape constancy", "Color constancy", "Apparent movement"], t: "A witch flying away on her broom looks tiny against the moon, but you don't think she's shrinking." },
  { c: "constancy", a: "Shape constancy", o: ["Size constancy", "Color constancy", "Apparent movement"], t: "The creaky coffin lid swings open at an angle, but you still see it as a rectangle." },
  { c: "constancy", a: "Color constancy", o: ["Size constancy", "Shape constancy", "Apparent movement"], t: "Under eerie green porch light, your white ghost costume still looks white to you." },
  { c: "constancy", a: "Apparent movement", o: ["Size constancy", "Shape constancy", "Color constancy"], t: "Flipping quickly through still drawings of a pumpkin makes it look like it's rolling across the page." },
];
const TOTAL = 10;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let state = fresh();
function fresh() { return { phase: "intro", deck: [], room: 0, step: 0, opts: null, pick: null, candy: 0, scares: [], log: [], name: "", period: "" }; }

function buildDeck() {
  // two scenes from every category, then shuffle
  const by = {};
  shuffle(SCEN.map((_, i) => i)).forEach((i) => (by[SCEN[i].c] = by[SCEN[i].c] || []).push(i));
  return shuffle(Object.values(by).flatMap((l) => l.slice(0, 2))).slice(0, TOTAL);
}
const cur = () => SCEN[state.deck[state.room]];
function makeOpts() {
  const sc = cur();
  if (state.step === 0) return Object.keys(CATS).map((k) => ({ label: CATS[k].name, ok: k === sc.c }));
  return shuffle([sc.a, ...sc.o]).map((t) => ({ label: t, ok: t === sc.a }));
}

function begin() { state = Object.assign(fresh(), { name: state.name, period: state.period }); state.deck = buildDeck(); state.scares = Array(TOTAL).fill(null); startRoom(); }
function startRoom() { state.phase = "play"; state.step = 0; state.pick = null; state.opts = makeOpts(); if (state.scares[state.room] === null) state.scares[state.room] = 0; render(); focusFirst(); }
function choose(i) {
  if (state.phase !== "play" || !state.opts[i]) return;
  const o = state.opts[i];
  state.pick = i;
  if (o.ok) state.candy++;
  else { state.scares[state.room]++; state.log.push({ sc: state.deck[state.room], step: state.step }); }
  state.phase = "feedback"; render();
  if (!o.ok) { const c = $("playCard"); c.classList.remove("boo"); void c.offsetWidth; c.classList.add("boo"); }
  const nb = $("nextBtn"); if (nb) nb.focus();
}
function next() {
  if (state.step === 0) { state.step = 1; state.phase = "play"; state.pick = null; state.opts = makeOpts(); render(); focusFirst(); return; }
  state.room++;
  if (state.room >= TOTAL) { state.phase = "end"; render(); const b = $("againBtn"); if (b) b.focus(); return; }
  startRoom();
}
function focusFirst() { const b = document.querySelector("#playCard .opt, #playCard .btn"); if (b) b.focus({ preventScroll: true }); }

document.addEventListener("keydown", (e) => {
  if (e.target.matches && e.target.matches("input")) return;
  if (state.phase === "play" && /^[1-5]$/.test(e.key)) { choose(+e.key - 1); e.preventDefault(); }
  else if (state.phase === "feedback" && e.key === "Enter" && document.activeElement?.id !== "nextBtn") { next(); e.preventDefault(); }
});

/* ---------- rendering ---------- */
function render() {
  $("candy").textContent = state.candy;
  $("roomNum").textContent = state.phase === "intro" ? 0 : Math.min(TOTAL, state.room + (state.phase === "end" ? 0 : 1));
  renderHouse();
  $("playCard").hidden = state.phase === "end";
  $("endCard").hidden = state.phase !== "end";
  if (state.phase === "end") renderEnd(); else renderPlay();
}

function windowColor(i) {
  const done = state.phase === "end" || i < state.room || (i === state.room && state.phase === "feedback" && state.step === 1);
  if (!done) return i === state.room && state.phase !== "intro" ? "var(--line)" : "var(--window-off)";
  const s = state.scares[i] || 0;
  return s === 0 ? "var(--pumpkin)" : s === 1 ? "var(--slime)" : "var(--blood)";
}
function renderHouse() {
  // two floors of five windows under a crooked roof and tower
  let s = `<rect x="0" y="0" width="600" height="250" fill="none"/>`;
  s += `<circle cx="530" cy="46" r="26" fill="var(--bone)" opacity=".85"/><circle cx="541" cy="40" r="24" fill="var(--panel)"/>`;
  s += `<polygon points="110,92 300,22 490,92" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"/>`;
  s += `<rect x="410" y="20" width="44" height="74" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"/><polygon points="400,22 432,-6 464,22" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"/>`;
  s += `<rect x="120" y="92" width="360" height="148" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"/>`;
  s += `<rect x="282" y="186" width="36" height="54" rx="18" fill="var(--sky)" stroke="var(--line)" stroke-width="2"/>`;
  s += `<line x1="0" y1="240" x2="600" y2="240" stroke="var(--line)" stroke-width="2"/>`;
  // rooms 1-5 on the top floor, rooms 6-9 on the ground floor around the door, room 10 in the tower
  const SLOTS = [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4], [1, 0], [1, 1], [1, 3], [1, 4]];
  for (let i = 0; i < SLOTS.length; i++) {
    const [row, col] = SLOTS[i];
    const x = 140 + col * 66, y = row ? 170 : 108;
    const w = 40, h = 42;
    const fill = windowColor(i);
    const glow = fill.includes("pumpkin") ? ' style="filter: drop-shadow(0 0 6px rgba(255,138,31,.7))"' : "";
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${fill}" stroke="var(--line)" stroke-width="2"${glow}/>`;
    s += `<line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + h}" stroke="var(--line)" stroke-width="2"/><line x1="${x}" y1="${y + h / 2}" x2="${x + w}" y2="${y + h / 2}" stroke="var(--line)" stroke-width="2"/>`;
  }
  // the tenth room is the tower window
  const tf = windowColor(9);
  s += `<rect x="420" y="38" width="24" height="30" rx="12" fill="${tf}" stroke="var(--line)" stroke-width="2"/>`;
  // a jack-o'-lantern by the door
  s += `<ellipse cx="250" cy="228" rx="16" ry="12" fill="var(--pumpkin)"/><polygon points="244,224 248,218 252,224" fill="var(--sky)"/><polygon points="252,224 256,218 260,224" fill="var(--sky)" transform="translate(-4,0)"/><rect x="243" y="230" width="14" height="3" fill="var(--sky)"/>`;
  $("house").innerHTML = s;
}
function renderPlay() {
  const el = $("playCard");
  if (state.phase === "intro") {
    el.innerHTML = `<div class="eyebrow"><span>Trick or treat</span><span>10 rooms · 20 pieces of candy</span></div>
      <h2>Enter if you dare</h2>
      <p>Each room of the haunted house holds a spooky scene that tricks your senses. Figure out what your brain is doing in two steps:</p>
      <ul><li><b>Step 1:</b> what kind of perception is at work (processing, Gestalt grouping, attention, depth, or constancy).</li>
      <li><b>Step 2:</b> the exact concept.</li></ul>
      <p>Every right answer earns a piece of candy and lights up that room's window. A wrong answer gets you a scare, shows the right answer, and you keep exploring. Press <kbd>1</kbd>–<kbd>5</kbd> to choose and <kbd>Enter</kbd> to continue.</p>
      <div class="row"><button class="btn" id="startBtn">Knock on the door</button></div>`;
    $("startBtn").onclick = begin; return;
  }
  const sc = cur(), done = state.phase === "feedback";
  const opts = state.opts.map((o, i) => {
    let c = "opt";
    if (done) c += o.ok ? " correct" : i === state.pick ? " wrong" : " fade";
    return `<button class="${c}" data-i="${i}" ${done ? "disabled" : ""}><kbd>${i + 1}</kbd><span>${esc(o.label)}</span></button>`;
  }).join("");
  let fb = "";
  if (done) {
    const ok = state.opts[state.pick].ok, right = state.opts.find((o) => o.ok).label;
    const last = state.step === 1, final = last && state.room === TOTAL - 1;
    const def = last ? ` ${esc(CATS[sc.c].terms[sc.a])}` : "";
    fb = `<div class="fb ${ok ? "good" : "bad"}"><p><span class="tag">${ok ? "Treat! " : "BOO! "}</span>${ok ? "" : `The answer is <b>${esc(right)}</b>.`}${def}</p>
      <button class="btn" id="nextBtn">${final ? "Escape the house" : last ? "Next room" : "Name the concept"}</button></div>`;
  }
  el.innerHTML = `<div class="eyebrow"><span>Room ${state.room + 1}: the ${ROOMS[state.room]}</span><span>Step ${state.step + 1} of 2</span></div>
    <p class="scene">${esc(sc.t)}</p>
    <p class="step-q">${state.step === 0 ? "What kind of perception is at work?" : "Which concept is it?"}</p>
    <div class="opts${state.step === 0 ? " five" : ""}">${opts}</div>${fb}`;
  el.querySelectorAll(".opt").forEach((b) => (b.onclick = () => choose(+b.dataset.i)));
  if (done) $("nextBtn").onclick = next;
}

function renderEnd() {
  const pct = Math.round((state.candy / (TOTAL * 2)) * 100);
  const head = pct >= 90 ? "Full candy bag!" : pct >= 70 ? "A good haul." : pct >= 50 ? "A few too many scares." : "The house got the best of you.";
  const per = {};
  state.deck.forEach((i) => { const k = SCEN[i].c; per[k] = per[k] || { got: 0, of: 0 }; per[k].of += 2; per[k].got += 2; });
  state.log.forEach((m) => per[SCEN[m.sc].c].got--);
  const chips = Object.keys(CATS).filter((k) => per[k]).map((k) => `<div class="cat-chip"><span>${CATS[k].name}</span><b>${per[k].got}/${per[k].of}</b></div>`).join("");
  const seen = new Set();
  const missed = state.log.filter((m) => !seen.has(m.sc) && seen.add(m.sc)).map((m) => {
    const sc = SCEN[m.sc];
    return `<div><b>${esc(sc.t)}</b><span>${esc(CATS[sc.c].name)} · ${esc(sc.a)}: ${esc(CATS[sc.c].terms[sc.a])}</span></div>`;
  }).join("");
  $("endCard").innerHTML = `<div class="eyebrow"><span>You escaped</span><span>${pct}% of the candy</span></div>
    <h2>${head}</h2>
    <div class="stats">
      <div class="stat"><b>${state.candy}/20</b><span>pieces of candy</span></div>
      <div class="stat"><b>${state.log.length}</b><span>scares</span></div>
      <div class="stat"><b>${state.scares.filter((s) => s === 0).length}/10</b><span>rooms with no scares</span></div>
    </div>
    <div class="cats">${chips}</div>
    ${missed ? `<p><b>Scenes to review</b></p><div class="missed">${missed}</div>` : `<p>Not a single scare. Every room cleared.</p>`}
    <div class="who">
      <label for="stuName">Name<input id="stuName" type="text" autocomplete="name" value="${esc(state.name)}"></label>
      <label for="stuPeriod">Period<input id="stuPeriod" type="text" value="${esc(state.period)}"></label>
    </div>
    <p class="print-only">Fright Sight · 2.1 Perception · completed ${esc(new Date().toLocaleString())}</p>
    <div class="row"><button class="btn" id="againBtn">Play again</button><button class="btn ghost" id="printBtn">Print / Save as PDF</button></div>
    <p class="print-note" id="printNote" hidden>Type your name before printing.</p>`;
  $("againBtn").onclick = begin;
  $("stuName").oninput = (e) => { state.name = e.target.value; e.target.classList.remove("need"); $("printNote").hidden = true; };
  $("stuPeriod").oninput = (e) => { state.period = e.target.value; };
  $("printBtn").onclick = () => {
    if (!state.name.trim()) { $("stuName").classList.add("need"); $("printNote").hidden = false; $("stuName").focus(); return; }
    printWithFileName(state.name, state.period, "Fright Sight");
  };
}

// Chrome uses the page title as the default PDF file name, so set it just for the print.
function printWithFileName(name, period, game) {
  const clean = (s) => String(s || "").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
  const d = new Date(), date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const p = clean(period);
  const parts = [clean(name), p && (/^\d+$/.test(p) ? "Period " + p : p), game, date].filter(Boolean);
  const old = document.title;
  document.title = parts.join(" - ");
  addEventListener("afterprint", () => { document.title = old; }, { once: true });
  window.print();
}

function renderRef() {
  $("refGrid").innerHTML = Object.values(CATS).map((c) => `<h3>${c.name}</h3>` +
    Object.entries(c.terms).map(([t, d]) => `<p><b>${esc(t)}</b>: ${esc(d)}</p>`).join("")).join("");
}
function start(data) { if (data && data.state) state = data.state; renderRef(); render(); }
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
