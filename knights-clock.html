<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knights Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@500;700&display=swap">
<style>
/* Layout: one full-screen board. Logo on the left, giant clock on the right, alarm strip below, controls in a bar that tucks away. */
:root {
  color-scheme: dark;
  --purple: #3b1d6e;
  --purple-deep: #26104a;
  --purple-line: #5a3a92;
  --gold: #c5b358;
  --gold-soft: #e3d79b;
  --alert: #ff6b5e;
  --f-digits: "Oswald", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 90% at 30% 20%, #4a2588 0%, var(--purple) 45%, var(--purple-deep) 100%);
  color: var(--gold);
  font-family: var(--f-body);
  overflow: hidden;
  display: grid;
  grid-template-rows: 1fr auto auto;
  padding: max(2vh, env(safe-area-inset-top, 0px)) 4vw max(2vh, env(safe-area-inset-bottom, 0px));
}
body.ringing { animation: flash 1s steps(1) infinite; }
@keyframes flash { 50% { background: var(--gold); color: var(--purple-deep); } }

.board { display: flex; align-items: center; justify-content: center; gap: 4vw; min-height: 0; }
/* sizes chosen so the widest time, "12:59 59 PM", fits beside the logo on 4:3 and 16:9 screens */
.logo { height: min(58vh, 30vw); width: auto; flex: none; filter: drop-shadow(0 1vh 2vh rgba(0,0,0,.35)); }
.clock { text-align: left; min-width: 0; }
.time { font-family: var(--f-digits); font-weight: 700; font-size: min(20vw, 38vh); line-height: .9; letter-spacing: .01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.time .sec { font-size: .38em; color: var(--gold-soft); margin-left: .12em; }
.time .ampm { font-size: .28em; margin-left: .15em; letter-spacing: .05em; }
.date { font-size: min(3.6vw, 5vh); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-soft); margin-top: 1.5vh; }

.alarm { display: flex; justify-content: center; align-items: stretch; gap: 2vw; margin-top: 2vh; }
.alarm[hidden] { display: none; }
.panel { border: 2px solid var(--gold); border-radius: 1.4vh; padding: 1.2vh 2.4vw; text-align: center; background: rgba(0,0,0,.18); min-width: 0; }
.panel .label { font-size: min(1.8vw, 2.6vh); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-soft); }
.panel .value { font-family: var(--f-digits); font-weight: 700; font-size: min(7vw, 10vh); line-height: 1.05; font-variant-numeric: tabular-nums; }
.panel.left .value { color: var(--gold); }
body.ringing .panel { border-color: currentColor; }
.ring-msg { font-family: var(--f-digits); font-size: min(6vw, 9vh); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; align-self: center; }

/* control bar */
.controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-top: 2vh; transition: opacity .3s; }
body.idle .controls { opacity: 0; pointer-events: none; }
body.idle { cursor: none; }
.controls label { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; }
.controls input[type="time"], .controls input[type="number"] {
  font: 700 18px var(--f-body); color: var(--purple-deep); background: var(--gold); border: 0; border-radius: 8px; padding: 6px 10px;
}
.controls input[type="number"] { width: 5.5em; }
.btn { font: 700 16px var(--f-body); cursor: pointer; border-radius: 8px; padding: 8px 16px; border: 2px solid var(--gold); background: var(--gold); color: var(--purple-deep); }
.btn.ghost { background: transparent; color: var(--gold); }
.btn:hover { filter: brightness(1.08); }
.sep { width: 2px; height: 28px; background: var(--purple-line); }
.note { width: 100%; text-align: center; font-size: 13px; color: var(--gold-soft); opacity: .8; min-height: 1em; }
:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 2px; }

@media (max-aspect-ratio: 1/1) {
  .board { flex-direction: column; gap: 2vh; }
  .logo { height: 28vh; }
  .clock { text-align: center; }
  .time { font-size: 22vw; }
  .date { font-size: 4.5vw; }
  .alarm { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { body.ringing { animation: none; outline: 1.5vh solid var(--gold); outline-offset: -1.5vh; } }
</style>
</head>

    <button class="btn" id="startTimerBtn">Start</button>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn ghost" id="clearBtn" hidden>Clear alarm</button>
    <button class="btn ghost" id="testBtn">Test sound</button>
    <button class="btn ghost" id="fsBtn">Full screen</button>
    <div class="note" id="note">Controls hide after a few seconds. Move the mouse to bring them back.</div>
  </section>

<script>
const $ = (id) => document.getElementById(id);
let alarmAt = null;      // Date the alarm goes off
let ringing = false;
let audioCtx = null, ringTimer = null;

function fmtClock(d, withSeconds) {
  let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, "0");
  const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return withSeconds ? { h, m, s: String(d.getSeconds()).padStart(2, "0"), ap } : `${h}:${m} ${ap}`;
}
function fmtLeft(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}

/* ---------- sound (Web Audio, no files needed) ---------- */
function ensureAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {}
}
function beep(at, freq) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.25, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);
  o.connect(g).connect(audioCtx.destination); o.start(at); o.stop(at + 0.25);
}
function chirp() { if (!audioCtx) return; const t = audioCtx.currentTime; [0, 0.3, 0.6].forEach((d) => beep(t + d, 880)); }

// The alarm sound is the embedded chime; the beep is only a backup if the browser refuses to play it.
const chime = $("chime");
function playChime() {
  chime.currentTime = 0;
  const p = chime.play();
  if (p && p.catch) p.catch(() => chirp());
}
chime.addEventListener("ended", () => { if (ringing) ringTimer = setTimeout(playChime, 800); }); // repeat while ringing
function unlockChime() {
  // a silent play during a click lets the chime play later without another click
  chime.muted = true;
  const p = chime.play();
  const done = () => { chime.pause(); chime.currentTime = 0; chime.muted = false; };
  if (p && p.then) p.then(done, done); else done();
}
function startRing() {
  ringing = true; document.body.classList.add("ringing"); showControls();
  $("alarmLeft").textContent = "0:00";
  ensureAudio(); playChime();
  $("clearBtn").hidden = false; $("clearBtn").textContent = "Stop alarm"; $("clearBtn").focus();
  setTimeout(() => { if (ringing) stopRing(); }, 60000); // ring for one minute at most
}
function stopRing() {
  ringing = false; clearTimeout(ringTimer); chime.pause(); chime.currentTime = 0; document.body.classList.remove("ringing");
  clearAlarm();
}

/* ---------- alarm ---------- */
function setAlarm(date) {
  alarmAt = date; ensureAudio(); if (!ringing) unlockChime();
  try { localStorage.setItem("knightsClockAlarm", String(+date)); } catch (e) {}
  $("alarmBox").hidden = false; $("clearBtn").hidden = false; $("clearBtn").textContent = "Clear alarm";
  $("alarmAt").textContent = fmtClock(date, false);
  $("note").textContent = `Alarm set for ${fmtClock(date, false)}.`;
  tick();
}
function clearAlarm() {
  alarmAt = null;
  try { localStorage.removeItem("knightsClockAlarm"); } catch (e) {}
  $("alarmBox").hidden = true; $("clearBtn").hidden = true;
  $("note").textContent = "Alarm cleared.";
}
$("setBtn").onclick = () => {
  const v = $("alarmTime").value;
  if (!v) { $("note").textContent = "Pick an alarm time first."; $("alarmTime").focus(); return; }
  const [h, m] = v.split(":").map(Number), now = new Date(), d = new Date(now);
  d.setHours(h, m, 0, 0);
  if (d <= now) d.setDate(d.getDate() + 1); // a time earlier than now means tomorrow
  setAlarm(d);
};
$("startTimerBtn").onclick = () => {
  const n = Number($("mins").value);
  if (!(n > 0)) { $("note").textContent = "Enter a number of minutes greater than 0."; $("mins").focus(); return; }
  setAlarm(new Date(Date.now() + n * 60000));
};
$("clearBtn").onclick = () => (ringing ? stopRing() : clearAlarm());
$("testBtn").onclick = () => { ensureAudio(); if (!ringing) playChime(); };
$("fsBtn").onclick = async () => {
  try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); }
  catch (e) { $("note").textContent = "Full screen isn't available here. Try pressing F11."; }
};
document.addEventListener("fullscreenchange", () => { $("fsBtn").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && ringing) stopRing();
  if ((e.key === "f" || e.key === "F") && !e.target.matches("input")) $("fsBtn").click();
});

/* ---------- clock ---------- */
function tick() {
  const now = new Date(), t = fmtClock(now, true);
  $("time").innerHTML = `${t.h}:${t.m}<span class="sec">${t.s}</span><span class="ampm">${t.ap}</span>`;
  $("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  document.title = `${t.h}:${t.m} ${t.ap} · Knights Clock`;
  if (alarmAt && !ringing) {
    const left = alarmAt - now;
    if (left <= 0) startRing(); else $("alarmLeft").textContent = fmtLeft(left);
  }
}
function schedule() { tick(); setTimeout(schedule, 1000 - (Date.now() % 1000) + 5); } // stay on the second boundary

/* ---------- auto-hide controls ---------- */
let idleTimer = null;
function showControls() {
  document.body.classList.remove("idle"); clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!ringing && !document.activeElement.matches("input")) document.body.classList.add("idle");
  }, 5000);
}
["mousemove", "mousedown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, showControls, { passive: true }));

// restore an alarm saved before a page refresh
try {
  const saved = Number(localStorage.getItem("knightsClockAlarm"));
  if (saved && saved > Date.now()) setAlarm(new Date(saved)); else localStorage.removeItem("knightsClockAlarm");
} catch (e) {}
const def = new Date(Date.now() + 15 * 60000);
$("alarmTime").value = `${String(def.getHours()).padStart(2, "0")}:${String(def.getMinutes()).padStart(2, "0")}`;
$("note").textContent = "Controls hide after a few seconds. Move the mouse to bring them back. Press F for full screen.";
schedule(); showControls();
</script>
</body>
</html>
